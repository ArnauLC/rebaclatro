<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rebaclatro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-black">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        
        // --- CONFIGURACIÓN BASE Y REGLAS CLÁSICAS ---
        const SUITS = ['Oros', 'Copas', 'Espadas', 'Bastos'];
        const RANKS = [1, 3, 12, 11, 10, 7, 6, 5, 4, 2]; 
        const TARGETS = [300, 1000, 2500, 6000, 15000, 35000, 100000];
        const suitEmojis = { Oros: '🪙', Copas: '🍷', Espadas: '⚔️', Bastos: '🪵' };

        const getFichasBase = (rank) => {
            switch(rank) {
                case 1: return 11;
                case 3: return 10;
                case 12: return 4;
                case 10: return 3; 
                case 11: return 2;
                default: return 0;
            }
        };

        const getPoder = (rank) => {
            const powerOrder = [2, 4, 5, 6, 7, 10, 11, 12, 3, 1];
            return powerOrder.indexOf(rank);
        };

        const RELIQUIAS_DB = [
            { id: 'r1', type: 'reliquia', name: 'El Chivato', desc: '+1 Mult Base permanente al ganar con cartas Blancas (2-7).', cost: 5, icon: '👁️' },
            { id: 'r2', type: 'reliquia', name: 'Bolsa de Oro', desc: 'Las cartas de Oros dan +15 Fichas al jugarlas.', cost: 6, icon: '💰' },
            { id: 'r3', type: 'reliquia', name: 'El Cobarde', desc: 'Si pierdes una baza, las Fichas de esa baza se guardan para tu próxima victoria.', cost: 7, icon: '🏃' },
            { id: 'r4', type: 'reliquia', name: 'Cante Jondo', desc: 'Cantar Las 40 o 20 da el doble de multiplicador base.', cost: 6, icon: '🎸' },
            { id: 'r5', type: 'reliquia', name: 'As bajo la manga', desc: 'Los Ases tienen +5 Poder.', cost: 8, icon: '🎴' },
            { id: 'r6', type: 'reliquia', name: 'Copa Sagrada', desc: 'Las Copas cuentan como Triunfo secundario.', cost: 8, icon: '🍷' },
            { id: 'r7', type: 'reliquia', name: 'Reciclaje', desc: 'Descartar otorga +5 Fichas a las cartas que se quedan en tu mano.', cost: 5, icon: '♻️' },
            { id: 'r8', type: 'reliquia', name: 'El Rey Loco', desc: 'Si ganas con un Rey, recibes $2 monedas extra.', cost: 6, icon: '👑' },
        ];

        const BEBIDAS_DB = [
            { id: 'b1', type: 'bebida', name: 'Cazalla', desc: '+5 Mult temporal para esta jugada.', cost: 3, icon: '🥃' },
            { id: 'b2', type: 'bebida', name: 'Carajillo', desc: 'Ganas +1 Tirada al instante.', cost: 4, icon: '☕' },
            { id: 'b3', type: 'bebida', name: 'Aigua de València', desc: 'Recuperas +1 Descarte.', cost: 3, icon: '🍹' },
            { id: 'b4', type: 'bebida', name: 'Cremaet', desc: '+20 Fichas temporales a la siguiente baza.', cost: 4, icon: '🔥' },
        ];

        const globalStyles = `
        @font-face {
            font-family: 'M6x11';
            src: url('https://raw.githubusercontent.com/ArnauLC/rebaclatro/main/M6x11.ttf') format('truetype');
        }

        * { font-family: 'M6x11', monospace; }
        .text-shadow { text-shadow: 3px 3px 0px #000; }
        .text-shadow-sm { text-shadow: 2px 2px 0px #000; }
        .pixel-border { border: 6px solid #000; box-shadow: 6px 6px 0px 0px #000; }
        .pixel-border-sm { border: 4px solid #000; box-shadow: 4px 4px 0px 0px #000; }
        .bg-felt { background-color: #0d3b22; background-image: radial-gradient(#12472b 3px, transparent 3px); background-size: 36px 36px; }

        @keyframes cau-shake {
          0% { transform: translate(3px, 3px) rotate(0deg) scale(1.1); }
          10% { transform: translate(-3px, -4px) rotate(-2deg) scale(1.1); }
          20% { transform: translate(-6px, 0px) rotate(2deg) scale(1.1); }
          30% { transform: translate(6px, 4px) rotate(0deg) scale(1.1); }
          40% { transform: translate(3px, -3px) rotate(2deg) scale(1.1); }
          50% { transform: translate(-3px, 4px) rotate(-2deg) scale(1.1); }
          60% { transform: translate(-6px, 3px) rotate(0deg) scale(1.1); }
          70% { transform: translate(6px, 3px) rotate(-2deg) scale(1.1); }
          80% { transform: translate(-3px, -3px) rotate(2deg) scale(1.1); }
          90% { transform: translate(3px, 4px) rotate(0deg) scale(1.1); }
          100% { transform: translate(3px, -4px) rotate(-2deg) scale(1.1); }
        }
        .animate-cau { animation: cau-shake 0.5s; animation-iteration-count: infinite; }
        `;

        // --- CONFIGURACIÓN DE IMÁGENES ---
        const REVERSO_URL = 'https://raw.githubusercontent.com/ArnauLC/rebaclatro/refs/heads/main/cards/reverso.png';
        const SPANISH_DECK_URL = 'https://raw.githubusercontent.com/ArnauLC/rebaclatro/refs/heads/main/spanish_deck/';

        const suitToLetter = {
            'Bastos': 'B',
            'Copas': 'C',
            'Espadas': 'E',
            'Oros': 'O'
        };

        const getCardImageUrl = (suit, rank) => {
            const letter = suitToLetter[suit];
            const paddedRank = String(rank).padStart(2, '0');
            return `${SPANISH_DECK_URL}${letter}-${paddedRank}.PNG`;
        };

        // --- COMPONENTES UI FIJOS ---
        const Card = ({ card, onClick, isSelected, disabled, isAi, hidden, isMuestra }) => {
            if (!card || hidden) {
                return (
                    <div className="w-[100px] h-[150px] flex items-center justify-center relative overflow-visible drop-shadow-xl">
                         <img 
                            src={REVERSO_URL} 
                            alt="Reverso de carta" 
                            className="absolute inset-0 w-full h-full object-contain" 
                            draggable="false"
                            onError={(e) => { e.target.style.display = 'none'; }}
                        />
                    </div>
                );
            }
            
            if (!card && !hidden && isAi) return <div className="w-[100px] h-[150px] border-4 border-dashed border-gray-600 rounded-xl opacity-20"></div>;
            
            const interactableClasses = (!disabled && !isAi && !isMuestra) 
                ? (isSelected 
                    ? '-translate-y-8 scale-110 drop-shadow-[0_0_20px_rgba(250,204,21,0.9)] z-20 cursor-pointer' 
                    : 'hover:-translate-y-4 hover:scale-105 z-10 translate-y-0 scale-100 cursor-pointer drop-shadow-xl')
                : (disabled && !isAi && !isMuestra ? 'opacity-50 grayscale translate-y-0 scale-100' : 'translate-y-0 scale-100 drop-shadow-xl');

            return (
                <div 
                    onClick={disabled || isMuestra ? null : onClick}
                    className={`relative flex flex-col items-center transition-all duration-200 ease-out transform ${interactableClasses}`}
                >
                    {!isMuestra && (
                        <div className={`absolute -top-5 left-1/2 transform -translate-x-1/2 bg-black bg-opacity-90 text-white text-base px-2 py-0.5 rounded border-2 border-gray-500 font-bold shadow-md pointer-events-none z-30`}>
                            {card.fichasActuales}
                        </div>
                    )}

                    <div className="w-[100px] h-[150px] flex flex-col justify-between select-none overflow-visible">
                        <img 
                            src={getCardImageUrl(card.suit, card.rank)} 
                            alt={`${card.rank} de ${card.suit}`} 
                            className="absolute inset-0 w-full h-full object-contain"
                            draggable="false"
                            onError={(e) => {
                                 e.target.onerror = null; 
                                 e.target.src = "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAiIGhlaWdodD0iMTUwIiBmaWxsPSIjZWVlIj48cmVjdCB3aWR0aD0iMTAwIiBoZWlnaHQ9IjE1MCIvPjx0ZXh0IHg9IjUwIiB5PSI3NSIgZm9udC1mYW1pbHk9ImFyaWFsIiBmb250LXNpemU9IjEyIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmaWxsPSIjMzMzIj5FcnJvciBpbWFnZW48L3RleHQ+PC9zdmc+";
                            }}
                        />
                    </div>
                </div>
            );
        };

        // --- APP PRINCIPAL ---
        function App() {
            const [scale, setScale] = useState(1);
            useEffect(() => {
                const handleResize = () => {
                    const scaleX = window.innerWidth / 1920;
                    const scaleY = window.innerHeight / 1080;
                    setScale(Math.min(scaleX, scaleY));
                };
                handleResize();
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            const [gameState, setGameState] = useState('MENU'); 
            const [round, setRound] = useState(1);
            const [score, setScore] = useState(0);
            const [targetScore, setTargetScore] = useState(TARGETS[0]);
            const [monedas, setMonedas] = useState(10);
            const [roundSummary, setRoundSummary] = useState(null);
            
            const [tiradasLeft, setTiradasLeft] = useState(10);
            const [descartesLeft, setDescartesLeft] = useState(3);
            
            const [deck, setDeck] = useState([]);
            const [discardPile, setDiscardPile] = useState([]);
            const [playerHand, setPlayerHand] = useState([]);
            const [aiHand, setAiHand] = useState([]);
            const [selectedCards, setSelectedCards] = useState([]); 
            const [muestra, setMuestra] = useState(null);
            const [trumpSuit, setTrumpSuit] = useState(null); 
            const [currentAiCard, setCurrentAiCard] = useState(null);
            const [playedPlayerCard, setPlayedPlayerCard] = useState(null);
            const [turnLeader, setTurnLeader] = useState('player'); 
            
            const [showDeckModal, setShowDeckModal] = useState(false);
            const [draggedIndex, setDraggedIndex] = useState(null);
            const [activeActionId, setActiveActionId] = useState(null);
            const [extraPlayMsg, setExtraPlayMsg] = useState(false);
            const [showLastTrick, setShowLastTrick] = useState(false);
            
            const [playerLastTrick, setPlayerLastTrick] = useState(null);
            const [aiLastTrick, setAiLastTrick] = useState(null);
            const [modalTrick, setModalTrick] = useState(null);

            const [reliquias, setReliquias] = useState([]);
            const [bebidas, setBebidas] = useState([]); 
            const [shopRelics, setShopRelics] = useState([null, null, null]);
            const [shopDrinks, setShopDrinks] = useState([null, null, null]);
            const [baseMult, setBaseMult] = useState(1);
            const [tempMult, setTempMult] = useState(0); 
            const [tempFichas, setTempFichas] = useState(0); 
            const [fichasAcumuladas, setFichasAcumuladas] = useState(0); 
            const [cantesRealizados, setCantesRealizados] = useState([]); 

            const [bazaResult, setBazaResult] = useState(null); 

            const handleGlobalClick = () => {
                setActiveActionId(null);
            };

            const createDeck = () => {
                let newDeck = [];
                SUITS.forEach(suit => {
                    RANKS.forEach(rank => {
                        newDeck.push({ 
                            id: `${suit}-${rank}-${Math.random()}`, 
                            suit, 
                            rank, 
                            fichasBase: getFichasBase(rank),
                            fichasActuales: getFichasBase(rank), 
                            poder: getPoder(rank),
                            revealed: false 
                        });
                    });
                });
                return newDeck.sort(() => Math.random() - 0.5);
            };

            const startGame = () => {
                setRound(1);
                setTargetScore(TARGETS[0]);
                setMonedas(10); 
                setReliquias([]);
                setBebidas([]);
                setBaseMult(1);
                setTempMult(0);
                setTempFichas(0);
                setFichasAcumuladas(0);
                setActiveActionId(null);
                setPlayerLastTrick(null);
                setAiLastTrick(null);
                generateShop();
                setGameState('INITIAL_SHOP'); 
            };

            const initRound = (r) => {
                let newDeck = createDeck();
                let m = newDeck.splice(0, 1)[0];
                let pHand = newDeck.splice(0, 6);
                let aHand = newDeck.splice(0, 6);
                
                setDeck(newDeck);
                setDiscardPile([]);
                setPlayerHand(pHand);
                setMuestra(m);
                setTrumpSuit(m.suit); 
                
                setTurnLeader('ai');
                let nextAiPlay = aiLeadLogic(aHand, m.suit);
                aHand = aHand.filter(c => c.id !== nextAiPlay.id);
                setCurrentAiCard(nextAiPlay);
                
                setAiHand(aHand);
                setTiradasLeft(10);
                setDescartesLeft(3);
                setScore(0);
                setSelectedCards([]);
                setPlayedPlayerCard(null);
                setBazaResult(null);
                setFichasAcumuladas(0);
                setCantesRealizados([]); 
                setBaseMult(1); 
                setTempMult(0);
                setTempFichas(0);
                setActiveActionId(null);
                setPlayerLastTrick(null);
                setAiLastTrick(null);
                setGameState('PLAYING');
            };

            const drawCards = (currentDeck, amount, currentMuestra) => {
                let drawn = [];
                let newDeck = [...currentDeck];
                let newMuestra = currentMuestra;
                for(let i=0; i<amount; i++) {
                    if (newDeck.length === 0) {
                        if (newMuestra) {
                            drawn.push(newMuestra);
                            newMuestra = null; 
                        } else break;
                    } else {
                        drawn.push(newDeck.shift());
                    }
                }
                return { drawn, newDeck, newMuestra };
            };

            const isTriunfo = (suit) => {
                if (!trumpSuit) return false;
                if (suit === trumpSuit) return true;
                if (suit === 'Copas' && reliquias.some(r => r.id === 'r6')) return true; 
                return false;
            };

            const getPoderModificado = (card) => {
                let poderMod = card.poder;
                if (card.rank === 1 && reliquias.some(r => r.id === 'r5')) poderMod += 5; 
                return poderMod;
            };

            const determineWinner = (leadCard, followCard) => {
                const leadIsTriunfo = isTriunfo(leadCard.suit);
                const followIsTriunfo = isTriunfo(followCard.suit);
                const leadPoder = getPoderModificado(leadCard);
                const followPoder = getPoderModificado(followCard);
                if (leadIsTriunfo && !followIsTriunfo) return 'lead';
                if (!leadIsTriunfo && followIsTriunfo) return 'follow';
                if (leadIsTriunfo && followIsTriunfo) return leadPoder > followPoder ? 'lead' : 'follow';
                if (followCard.suit === leadCard.suit) return leadPoder > followPoder ? 'lead' : 'follow';
                return 'lead'; 
            };

            const aiLeadLogic = (hand, tSuit) => {
                if (hand.length === 0) return null;
                let nonTrumps = hand.filter(c => c.suit !== tSuit);
                if (nonTrumps.length > 0) {
                    nonTrumps.sort((a, b) => getPoderModificado(b) - getPoderModificado(a));
                    return nonTrumps[0]; 
                } else {
                    let trumps = [...hand].sort((a, b) => getPoderModificado(a) - getPoderModificado(b));
                    return trumps[0]; 
                }
            };

            const aiFollowLogic = (hand, leadCard, tSuit, isUltimas) => {
                if (hand.length === 0) return null;
                let validCards = hand;
                if (isUltimas) {
                    const hasLeadSuit = hand.some(c => c.suit === leadCard.suit);
                    const hasTrump = hand.some(c => c.suit === tSuit);
                    if (hasLeadSuit) validCards = hand.filter(c => c.suit === leadCard.suit);
                    else if (hasTrump) validCards = hand.filter(c => c.suit === tSuit);
                }
                let winningCards = validCards.filter(c => determineWinner(leadCard, c) === 'follow');
                if (winningCards.length > 0) return winningCards.sort((a,b) => getPoderModificado(a) - getPoderModificado(b))[0];
                let nonTrumps = validCards.filter(c => c.suit !== tSuit);
                return nonTrumps.length > 0 ? nonTrumps.sort((a,b) => getPoderModificado(a) - getPoderModificado(b))[0] : [...validCards].sort((a,b) => getPoderModificado(a) - getPoderModificado(b))[0];
            };

            const getPosiblesCantes = () => {
                let cantes = [];
                SUITS.forEach(suit => {
                    if (cantesRealizados.includes(suit)) return;
                    const tieneRey = playerHand.some(c => c.suit === suit && c.rank === 12);
                    const tieneSota = playerHand.some(c => c.suit === suit && c.rank === 10);
                    if (tieneRey && tieneSota) {
                        cantes.push({ suit, tipo: isTriunfo(suit) ? '40' : '20', nombre: isTriunfo(suit) ? `40 en ${suit}` : `20 en ${suit}` });
                    }
                });
                return cantes;
            };

            const cantar = (cante) => {
                setCantesRealizados([...cantesRealizados, cante.suit]);
                let multBonus = cante.tipo === '40' ? 4 : 2;
                if (reliquias.some(r => r.id === 'r4')) multBonus *= 2; 
                setTempMult(m => m + multBonus);
                setBazaResult({ message: `¡CANTAS LAS ${cante.nombre.toUpperCase()}! (+${multBonus} Mult)`, winner: 'canto', cau: false });
                setTimeout(() => setBazaResult(null), 1500);
            };

            const toggleCardSelection = (card) => {
                if (selectedCards.find(c => c.id === card.id)) setSelectedCards(selectedCards.filter(c => c.id !== card.id));
                else if (selectedCards.length < 3) setSelectedCards([...selectedCards, card]);
            };

            const handleDiscard = () => {
                if (descartesLeft <= 0 || selectedCards.length === 0 || (deck.length === 0 && !muestra)) return;
                let currentHand = [...playerHand];
                if (reliquias.some(r => r.id === 'r7')) {
                    currentHand = currentHand.map(c => !selectedCards.find(sc => sc.id === c.id) ? { ...c, fichasActuales: c.fichasActuales + 5 } : c);
                }
                let newHand = currentHand.filter(c => !selectedCards.find(sc => sc.id === c.id));
                let discarded = currentHand.filter(c => selectedCards.find(sc => sc.id === c.id));
                let { drawn, newDeck, newMuestra } = drawCards(deck, 6 - newHand.length, muestra);
                setDeck(newDeck);
                setDiscardPile([...discardPile, ...discarded]);
                setMuestra(newMuestra);
                setPlayerHand([...newHand, ...drawn]);
                setSelectedCards([]);
                setDescartesLeft(d => d - 1);
            };

            const consumeBebida = (index) => {
                if (gameState !== 'PLAYING') return;
                const bebida = bebidas[index];
                if (bebida.id === 'b1') setTempMult(m => m + 5);
                if (bebida.id === 'b2') setTiradasLeft(t => t + 1);
                if (bebida.id === 'b3') setDescartesLeft(d => d + 1);
                if (bebida.id === 'b4') setTempFichas(f => f + 20);
                setBazaResult({ message: `¡Te tomas ${bebida.name}!`, winner: 'canto', cau: false });
                setTimeout(() => setBazaResult(null), 1200);
                setBebidas(b => b.filter((_, i) => i !== index));
            };

            const playCard = (pCard) => {
                if (tiradasLeft <= 0) return;
                const isUltimas = deck.length === 0 && !muestra;
                if (isUltimas && turnLeader === 'ai' && currentAiCard) {
                    const hasSuit = playerHand.some(c => c.suit === currentAiCard.suit);
                    const hasTrump = playerHand.some(c => c.suit === trumpSuit);
                    let valid = true;
                    if (hasSuit && pCard.suit !== currentAiCard.suit) valid = false;
                    else if (!hasSuit && hasTrump && pCard.suit !== trumpSuit) valid = false;
                    if (!valid) {
                        setBazaResult({ message: "¡ASISTE AL PALO O TIRA TRIUNFO!", winner: 'error', cau: false });
                        setTimeout(() => setBazaResult(null), 1500);
                        return;
                    }
                }
                const newTiradas = tiradasLeft - 1;
                setTiradasLeft(newTiradas);
                setPlayedPlayerCard(pCard);
                setSelectedCards([]);
                setActiveActionId(null);
                setGameState('RESOLVING');
                let currentAiHand = [...aiHand];
                let aiCard, winner;
                if (turnLeader === 'ai') {
                    aiCard = currentAiCard;
                    winner = determineWinner(aiCard, pCard) === 'lead' ? 'ai' : 'player';
                } else {
                    aiCard = aiFollowLogic(currentAiHand, pCard, trumpSuit, isUltimas);
                    setCurrentAiCard(aiCard);
                    currentAiHand = currentAiHand.filter(c => c.id !== aiCard.id);
                    winner = determineWinner(pCard, aiCard) === 'lead' ? 'player' : 'ai';
                }
                let fichasBase = pCard.fichasActuales + (aiCard ? aiCard.fichasActuales : 0) + fichasAcumuladas + tempFichas;
                if (pCard.suit === 'Oros' && reliquias.some(r => r.id === 'r2')) fichasBase += 15;
                let isCau = false, pMult = baseMult + tempMult, xMult = 1, message = '';
                if (winner === 'player') {
                    if (pCard.rank === (muestra ? muestra.rank : -1)) { isCau = true; xMult = 3; message = "¡EL CAU!"; }
                    else message = "¡BAZA GANADA!";
                    if (pCard.rank <= 7 && reliquias.some(r => r.id === 'r1')) setBaseMult(m => m + 1);
                    if (pCard.rank === 12 && reliquias.some(r => r.id === 'r8')) setMonedas(m => m + 2);
                    setFichasAcumuladas(0);
                    setPlayerLastTrick({ pCard, aiCard, winner, totalPuntos: Math.floor(fichasBase * pMult * xMult) });
                } else {
                    fichasBase = 0; message = "Baza Perdida";
                    if (reliquias.some(r => r.id === 'r3')) setFichasAcumuladas(f => f + (aiCard ? aiCard.fichasActuales : 0) + pCard.fichasActuales);
                    setAiLastTrick({ pCard, aiCard, winner, totalPuntos: 0 });
                }
                const totalPuntos = Math.floor(fichasBase * pMult * xMult);
                setBazaResult({ winner, message, fichas: fichasBase, mult: pMult, xMult, total: totalPuntos, cau: isCau });
                let newDiscardPile = [...discardPile, pCard, aiCard];
                setDiscardPile(newDiscardPile);
                setTempMult(0); setTempFichas(0);
                setTimeout(() => {
                    const newScore = score + totalPuntos;
                    const extraRes = Math.max(0, Math.floor(newScore / 100) - Math.floor(score / 100));
                    if (extraRes > 0) { setTiradasLeft(t => t + extraRes); setDescartesLeft(d => d + extraRes); setExtraPlayMsg(true); setTimeout(() => setExtraPlayMsg(false), 2000); }
                    setScore(newScore);
                    setTurnLeader(winner);
                    let newPHand = playerHand.filter(c => c.id !== pCard.id);
                    let nextPHand = [], nextAHand = [], firstDraw, secondDraw;
                    if (winner === 'player') {
                        firstDraw = drawCards(deck, 6 - newPHand.length, muestra);
                        secondDraw = drawCards(firstDraw.newDeck, 6 - currentAiHand.length, firstDraw.newMuestra);
                        nextPHand = [...newPHand, ...firstDraw.drawn]; nextAHand = [...currentAiHand, ...secondDraw.drawn];
                    } else {
                        firstDraw = drawCards(deck, 6 - currentAiHand.length, muestra);
                        secondDraw = drawCards(firstDraw.newDeck, 6 - newPHand.length, firstDraw.newMuestra);
                        nextAHand = [...currentAiHand, ...firstDraw.drawn]; nextPHand = [...newPHand, ...secondDraw.drawn];
                    }
                    if (nextPHand.length === 0 && nextAHand.length === 0 && newScore < targetScore && (newTiradas + extraRes) > 0) {
                        let freshDeck = [...newDiscardPile].sort(() => Math.random() - 0.5);
                        let m = freshDeck.splice(0, 1)[0];
                        nextPHand = freshDeck.splice(0, 6); nextAHand = freshDeck.splice(0, 6);
                        setDeck(freshDeck); setDiscardPile([]); if (m) { setMuestra(m); setTrumpSuit(m.suit); }
                    } else { setDeck(secondDraw.newDeck); setMuestra(secondDraw.newMuestra); }
                    setPlayerHand(nextPHand);
                    if (newScore >= targetScore) {
                        const finalCoins = 4 + Math.floor((newTiradas + extraRes) / 2);
                        setMonedas(m => m + finalCoins);
                        setRoundSummary({ score: newScore, target: targetScore, tiradasLeft: newTiradas + extraRes, descartesLeft: descartesLeft + extraRes, monedasEarned: finalCoins });
                        generateShop(); setGameState('ROUND_SUMMARY');
                    } else if ((newTiradas + extraRes) <= 0) setGameState('GAMEOVER');
                    else {
                        if (winner === 'ai') {
                            let nextAiPlay = aiLeadLogic(nextAHand, trumpSuit);
                            if (nextAiPlay) { nextAHand = nextAHand.filter(c => c.id !== nextAiPlay.id); setCurrentAiCard(nextAiPlay); }
                        } else setCurrentAiCard(null);
                        setAiHand(nextAHand); setPlayedPlayerCard(null); setBazaResult(null); setGameState('PLAYING');
                    }
                }, 1800);
            };

            const handlePlayCardBtn = () => { if (tiradasLeft > 0 && selectedCards.length === 1) playCard(selectedCards[0]); };
            const handleDragStart = (e, i) => { setDraggedIndex(i); if (e.dataTransfer) { e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', i.toString()); } };
            const handleDropInHand = (e, i) => { e.preventDefault(); if (draggedIndex !== null && draggedIndex !== i) { const newHand = [...playerHand]; const [dragged] = newHand.splice(draggedIndex, 1); newHand.splice(i, 0, dragged); setPlayerHand(newHand); } setDraggedIndex(null); };
            const sortHandBySuit = () => { const order = ['Oros', 'Copas', 'Espadas', 'Bastos']; setPlayerHand([...playerHand].sort((a, b) => { if (isTriunfo(a.suit) && !isTriunfo(b.suit)) return -1; if (!isTriunfo(a.suit) && isTriunfo(b.suit)) return 1; if (a.suit !== b.suit) return order.indexOf(a.suit) - order.indexOf(b.suit); return getPoder(b.rank) - getPoder(a.rank); })); };
            const sortHandByPower = () => { setPlayerHand([...playerHand].sort((a, b) => { if (isTriunfo(a.suit) && !isTriunfo(b.suit)) return -1; if (!isTriunfo(a.suit) && isTriunfo(b.suit)) return 1; if (getPoder(a.rank) !== getPoder(b.rank)) return getPoder(b.rank) - getPoder(a.rank); return SUITS.indexOf(a.suit) - SUITS.indexOf(b.suit); })); };

            const generateShop = () => {
                let rs = [null, null, null], ds = [null, null, null];
                let avR = RELIQUIAS_DB.filter(r => !reliquias.some(myR => myR.id === r.id)), avD = [...BEBIDAS_DB];
                for(let i=0; i<3; i++) if(avR.length) rs[i] = { ...avR.splice(Math.floor(Math.random() * avR.length), 1)[0], uId: Math.random() };
                for(let i=0; i<3; i++) if(avD.length) ds[i] = { ...avD.splice(Math.floor(Math.random() * avD.length), 1)[0], uId: Math.random() };
                setShopRelics(rs); setShopDrinks(ds);
            };

            const buyItem = (item, index, type) => { if (monedas >= item.cost) { if (type === 'bebida' && bebidas.length < 3) { setMonedas(m => m - item.cost); setBebidas([...bebidas, item]); let n = [...shopDrinks]; n[index] = null; setShopDrinks(n); } else if (type === 'reliquia' && reliquias.length < 5) { setMonedas(m => m - item.cost); setReliquias([...reliquias, item]); let n = [...shopRelics]; n[index] = null; setShopRelics(n); } } };
            const sellItem = (item, index, type) => { setMonedas(m => m + Math.max(1, Math.floor(item.cost / 2))); if (type === 'reliquia') setReliquias(reliquias.filter((_, i) => i !== index)); else setBebidas(bebidas.filter((_, i) => i !== index)); };
            const nextRound = () => { if (round >= TARGETS.length) setGameState('VICTORY'); else { setRound(r => r + 1); setTargetScore(TARGETS[round]); initRound(round + 1); } };

            return (
                <div className="fixed inset-0 bg-[#071a10] flex items-center justify-center overflow-hidden">
                    <style>{globalStyles}</style>
                    <div style={{ width: '1920px', height: '1080px', minWidth: '1920px', minHeight: '1080px', transform: `scale(${scale})`, transformOrigin: 'center' }} className="bg-felt text-white flex flex-col relative select-none shadow-[0_0_50px_rgba(0,0,0,1)] border-4 border-black overflow-hidden shrink-0" onClick={handleGlobalClick}>
                        
                        {(gameState === 'PLAYING' || gameState === 'RESOLVING') && (
                            <div className="w-full h-[80px] bg-[#0a1711] border-b-8 border-black px-6 flex justify-between items-center z-30 shadow-lg shrink-0">

                                    <div className="text-3xl text-yellow-400 text-shadow">COTO {round} <span className="text-gray-400 text-xl">/ {TARGETS.length}</span></div>

                                </div>
                                <div className="flex-1 flex flex-col items-center">
                                    <div className="text-5xl font-bold mb-2"><span className="text-blue-400">{score}</span> / <span className="text-red-500">{targetScore}</span></div>
                                    <div className="w-[500px] h-4 bg-gray-900 pixel-border-sm"><div className="h-full bg-blue-500 transition-all duration-300" style={{ width: `${Math.min(100, (score/targetScore)*100)}%` }}></div></div>
                                </div>
                                <div className="w-[300px] flex flex-col items-end">
                                    <div className="text-2xl text-purple-300">Mult: x{baseMult + tempMult}</div>
                                </div>
                            </div>

                        {(gameState === 'PLAYING' || gameState === 'RESOLVING' || gameState === 'SHOP' || gameState === 'INITIAL_SHOP') && (
                            <div className="flex-1 flex flex-row overflow-hidden">
                                <div className="w-[200px] flex flex-col items-center py-8 gap-8 bg-black bg-opacity-40 border-r-4 border-black z-40 shrink-0">
                                    <span className="text-2xl text-purple-300 font-bold">RELIQUIAS</span>
                                    {reliquias.map((r, i) => (
                                        <div key={i} onClick={e => { e.stopPropagation(); setActiveActionId(activeActionId === `r-${i}` ? null : `r-${i}`); }} className="w-[100px] h-[100px] bg-purple-900 border-4 border-purple-400 flex items-center justify-center text-5xl cursor-pointer group relative">
                                            {r.icon}

                                            {activeActionId === `r-${i}` && (gameState === 'SHOP' || gameState === 'INITIAL_SHOP') && <button onClick={() => sellItem(r, i, 'reliquia')} className="absolute top-1/2 left-full ml-4 -translate-y-1/2 bg-red-600 px-6 py-3 pixel-border text-2xl whitespace-nowrap z-50">VENDER (+{Math.max(1, Math.floor(r.cost / 2))}💰)</button>}
                                        </div>
                                    ))}

                                    {(gameState === 'SHOP' || gameState === 'INITIAL_SHOP') && (
                                        <div className="w-full h-full flex flex-col items-center justify-between py-12">
                                            <div className="flex flex-col items-center">
                                                <h2 className="text-6xl text-yellow-400 mb-6 text-shadow font-bold">{gameState === 'INITIAL_SHOP' ? 'TIENDA INICIAL' : 'PREPARACIÓN DE COTO'}</h2>
                                                <div className="bg-[#0d3b22] bg-opacity-90 p-4 rounded-xl shadow-2xl flex items-center gap-8">
                                                    <p className="text-4xl bg-[#1f1626] px-8 py-4 pixel-border font-bold">Bolsa: <span className="text-yellow-400">💰 {monedas}</span></p>
                                                    <button onClick={handleReroll} disabled={monedas < 2} className={`text-3xl px-8 py-4 pixel-border font-bold transition-all shadow-[6px_6px_0_0_#000] ${monedas >= 2 ? 'bg-blue-600 hover:bg-blue-500' : 'bg-gray-800 text-gray-500'}`}>RENOVAR (💰2)</button>
                                                </div>
                                            </div>
                                            <div className="flex flex-row w-full max-w-[1500px] gap-8">

                                                        ) : <div key={i} className="flex-1 h-[300px] bg-[#20120a] border-dashed border-gray-600 flex items-center justify-center text-2xl text-gray-500">VENDIDO</div>)}

                                                </div>
                                            </div>
                                            <button onClick={() => gameState === 'INITIAL_SHOP' ? initRound(1) : nextRound()} className="bg-blue-600 px-16 py-4 pixel-border shadow-[8px_8px_0_0_#000] text-4xl font-bold animate-pulse">EMPEZAR PARTIDA ➔</button>
                                        </div>
                                    )}

                                    {(gameState === 'PLAYING' || gameState === 'RESOLVING') && (
                                        <>
                                            <div className="w-full flex justify-center mt-4 shrink-0"><div className="flex -space-x-8 scale-[0.85] opacity-80 pointer-events-none">{aiHand.map((c, i) => <Card key={i} card={c} hidden={!c.revealed} isAi />)}</div></div>
                                            <div className="absolute left-8 top-4 flex flex-col items-center z-20">
                                                {aiLastTrick ? <div className="w-[80px] h-[120px] relative cursor-pointer hover:scale-110 transition-transform" onClick={() => { setModalTrick(aiLastTrick); setShowLastTrick(true); }}><div className="absolute inset-0 bg-red-900 opacity-40 rounded pixel-border-sm overflow-hidden flex items-center justify-center border-red-600"><img src={REVERSO_URL} className="w-full h-full object-cover opacity-50" /></div><span className="absolute bottom-[-25px] w-[130px] left-1/2 -translate-x-1/2 text-sm text-red-300 font-bold text-center bg-black bg-opacity-70 px-2 rounded">Baza Rival</span></div> : <div className="w-[80px] h-[120px] border-4 border-dashed border-gray-700 opacity-20" />}
                                            </div>
                                            <div className="w-full flex justify-between items-center flex-1">
                                                <div className="w-[400px] flex items-center pl-8">
                                                    <div className="relative w-[130px] h-[180px] flex items-center justify-start">
                                                        {muestra ? <div className="absolute left-12 top-1/2 -translate-y-1/2 rotate-90 w-[100px] h-[150px] z-10"><Card card={muestra} isMuestra /></div> : <div className="absolute left-12 top-1/2 -translate-y-1/2 text-8xl opacity-80 z-10">{suitEmojis[trumpSuit]}</div>}
                                                        {deck.length > 0 && <div className="absolute left-0 top-1/2 -translate-y-1/2 w-[100px] h-[150px] cursor-pointer z-30 hover:scale-105 transition-transform" onClick={() => setShowDeckModal(true)}>{[...Array(Math.min(4, Math.ceil(deck.length/8)))].map((_, i) => <img key={i} src={REVERSO_URL} className="absolute w-full h-full object-contain drop-shadow-xl" style={{ top: `${i*-3}px`, left: `${i*-3}px` }} />)}<div className="absolute top-0 right-0 bg-red-600 text-white font-bold px-2 py-1 text-lg rounded pixel-border-sm translate-x-1/2 -translate-y-1/2">{deck.length}</div></div>}
                                                        {deck.length === 0 && muestra && <div className="absolute top-[105%] left-0 w-[100px] text-center text-red-500 font-bold bg-black bg-opacity-80 px-2 rounded pixel-border-sm animate-pulse">ÚLTIMA</div>}
                                                    </div>
                                                    <div className="ml-[80px] flex flex-col items-center bg-black bg-opacity-70 p-4 rounded pixel-border-sm z-40">
                                                        <span className="text-2xl text-yellow-300 font-bold">TRIUNFO</span>
                                                        {muestra && <span className="bg-black text-white text-xl px-4 py-1 rounded border-2 border-gray-500 font-bold">{muestra.fichasActuales}</span>}
                                                    </div>
                                                </div>
                                                <div className="flex-1 flex flex-col items-center justify-center gap-6 relative">
                                                    <div className="z-10">{ (turnLeader === 'ai' || gameState === 'RESOLVING') ? <Card card={currentAiCard} isAi /> : <div className="w-[100px] h-[150px] border-4 border-dashed border-gray-600 rounded-xl opacity-20" /> }</div>
                                                    <div className="text-5xl text-gray-500 opacity-40 font-bold">VS</div>
                                                    <div onDragOver={e => e.preventDefault()} onDrop={e => { e.preventDefault(); const i = parseInt(e.dataTransfer.getData('text/plain')); if (!isNaN(i)) playCard(playerHand[i]); setDraggedIndex(null); }} className={`w-[110px] h-[160px] border-8 border-dashed rounded-xl flex items-center justify-center transition-colors z-10 ${draggedIndex !== null ? 'border-green-400 bg-green-600 bg-opacity-40 animate-pulse' : 'border-blue-600 bg-blue-900 bg-opacity-30'}`}>{playedPlayerCard && <Card card={playedPlayerCard} isAi />}</div>
                                                    {bazaResult && <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-50 pointer-events-none w-[600px]"><div className={`text-center bg-[#0b141a] bg-opacity-95 p-8 pixel-border shadow-2xl ${bazaResult.cau ? 'animate-cau' : 'animate-bounce'}`}><h2 className={`text-5xl font-bold mb-4 ${bazaResult.winner === 'player' || bazaResult.winner === 'canto' ? 'text-yellow-400' : 'text-red-500'}`}>{bazaResult.message}</h2>{bazaResult.winner === 'player' && <><div className="text-3xl text-white flex gap-4 justify-center"><span className="text-blue-300 bg-blue-900 px-3 py-1 rounded">{bazaResult.fichas} Fichas</span><span className="text-red-400 bg-red-900 px-3 py-1 rounded">x{bazaResult.mult}</span></div><div className="text-6xl text-green-400 mt-6 font-bold">+ {bazaResult.total}</div></>}</div></div>}
                                                </div>
                                                <div className="w-[400px] flex items-center justify-center">
                                                    {fichasAcumuladas > 0 && <div className="flex flex-col items-center animate-pulse"><span className="text-2xl text-orange-300 font-bold">BOTE</span><span className="text-4xl text-yellow-400 font-bold bg-black px-6 py-2 pixel-border">+{fichasAcumuladas}</span></div>}
                                                </div>
                                            </div>
                                            <div className="w-full flex flex-col items-center shrink-0 mt-2 relative">
                                                <div className="absolute left-8 bottom-0 w-[150px] flex items-end pb-8">
                                                    {playerLastTrick ? <div className="w-[80px] h-[120px] relative cursor-pointer hover:scale-110 transition-transform" onClick={() => { setModalTrick(playerLastTrick); setShowLastTrick(true); }}><div className="absolute inset-0 bg-blue-900 opacity-40 rounded pixel-border-sm overflow-hidden flex items-center justify-center border-blue-600"><img src={REVERSO_URL} className="w-full h-full object-cover opacity-50" /></div><span className="absolute bottom-[-25px] w-[130px] left-1/2 -translate-x-1/2 text-sm text-yellow-300 font-bold text-center bg-black bg-opacity-70 px-2 rounded">Tu Última Baza</span></div> : <div className="w-[80px] h-[120px] border-4 border-dashed border-gray-700 opacity-30" />}
                                                </div>
                                                <div className="flex gap-4 h-12 mb-2 justify-center">{gameState === 'PLAYING' && getPosiblesCantes().map((c, i) => <button key={i} onClick={() => cantar(c)} className="bg-yellow-600 px-8 py-2 pixel-border-sm text-xl font-bold">¡CANTAR {c.nombre}!</button>)}</div>
                                                <div className="flex gap-8 mb-2 justify-center">
                                                    <div className="relative"><button onClick={handlePlayCardBtn} disabled={selectedCards.length !== 1 || tiradasLeft <= 0} className={`w-[260px] py-4 pixel-border text-2xl font-bold ${selectedCards.length === 1 && tiradasLeft > 0 ? 'bg-blue-600' : 'bg-gray-800 text-gray-600'}`}>JUGAR ({tiradasLeft})</button>{extraPlayMsg && <div className="absolute -top-10 left-1/2 -translate-x-1/2 text-green-400 text-2xl font-bold animate-bounce whitespace-nowrap">+1 JUGADA!</div>}</div>
                                                    <button onClick={handleDiscard} disabled={selectedCards.length === 0 || descartesLeft <= 0 || (deck.length === 0 && !muestra)} className={`w-[260px] py-4 pixel-border text-2xl font-bold ${selectedCards.length > 0 && descartesLeft > 0 ? 'bg-red-600' : 'bg-gray-800 text-gray-600'}`}>DESCARTAR ({descartesLeft})</button>
                                                </div>
                                                <div className="w-full flex justify-center items-end max-w-[1200px] gap-6">
                                                    <div className="flex justify-center items-center gap-4 bg-black bg-opacity-60 px-8 pt-6 pb-2 rounded-t-2xl pixel-border border-b-0 h-[210px] shrink-0">
                                                        {playerHand.map((c, i) => <div key={c.id} draggable={gameState === 'PLAYING'} onDragStart={e => handleDragStart(e, i)} onDragOver={e => e.preventDefault()} onDrop={e => handleDropInHand(e, i)} onDragEnd={() => setDraggedIndex(null)} className={`cursor-move flex flex-col justify-end ${draggedIndex === i ? 'opacity-30' : 'opacity-100'}`}><Card card={c} onClick={() => toggleCardSelection(c)} isSelected={selectedCards.find(sc => sc.id === c.id)} disabled={gameState !== 'PLAYING'} /></div>)}
                                                    </div>
                                                    <div className="flex flex-col gap-4 bg-black bg-opacity-60 p-4 pb-2 pixel-border-sm rounded-t-2xl border-b-0 mb-4 shrink-0">
                                                        <span className="text-xl text-gray-400 text-center font-bold">ORDENAR</span>
                                                        <button onClick={sortHandBySuit} className="bg-blue-800 px-6 py-3 pixel-border-sm font-bold shadow-[4px_4px_0_0_#000]">PALO</button>
                                                        <button onClick={sortHandByPower} className="bg-red-800 px-6 py-3 pixel-border-sm font-bold shadow-[4px_4px_0_0_#000]">PUNTOS</button>
                                                    </div>
                                                </div>
                                            </div>
                                        </>
                                    )}
                                </div>

                                <div className="w-[200px] flex flex-col items-center py-8 gap-8 bg-black bg-opacity-40 border-l-4 border-black z-40 shrink-0">

                                    {bebidas.map((b, i) => (
                                        <div key={i} onClick={e => { e.stopPropagation(); setActiveActionId(activeActionId === `b-${i}` ? null : `b-${i}`); }} className="w-[100px] h-[100px] bg-orange-900 border-4 border-orange-400 flex items-center justify-center text-5xl cursor-pointer group relative">
                                            {b.icon}
                                            {activeActionId !== `b-${i}` && <div className="absolute top-1/2 right-full mr-6 -translate-y-1/2 w-80 bg-[#1a0f14] p-4 pixel-border opacity-0 group-hover:opacity-100 z-50 pointer-events-none transition-opacity text-center"><p className="text-yellow-300 text-2xl mb-2">{b.name}</p><p className="text-xl">{b.desc}</p></div>}
                                            {activeActionId === `b-${i}` && <div className="absolute top-1/2 right-full mr-4 -translate-y-1/2 z-50 flex flex-col gap-2 bg-[#1a0f14] p-3 pixel-border cursor-default" onClick={e=>e.stopPropagation()}>{gameState === 'PLAYING' && <button onClick={() => { consumeBebida(i); setActiveActionId(null); }} className="bg-green-600 px-6 py-3 pixel-border-sm text-2xl whitespace-nowrap">USAR AHORA</button>}{(gameState === 'SHOP' || gameState === 'INITIAL_SHOP') && <button onClick={() => { sellItem(b, i, 'bebida'); setActiveActionId(null); }} className="bg-red-600 px-6 py-3 pixel-border-sm text-2xl whitespace-nowrap">VENDER (+{Math.max(1, Math.floor(b.cost / 2))}💰)</button>}</div>}
                                        </div>
                                    ))}
                                    {[...Array(3-bebidas.length)].map((_, i) => <div key={i} className="w-[100px] h-[100px] border-4 border-dashed border-orange-800 bg-black bg-opacity-30 flex items-center justify-center opacity-20 text-3xl">☕</div>)}
                                </div>
                            </div>
                        )}

                        {showLastTrick && modalTrick && (
                            <div className="absolute inset-0 bg-black bg-opacity-95 z-[120] flex items-center justify-center p-8" onClick={() => { setShowLastTrick(false); setModalTrick(null); }}>
                                <div className="bg-[#1a2b22] p-12 pixel-border max-w-4xl w-full flex flex-col items-center" onClick={e => e.stopPropagation()}>
                                    <h2 className="text-5xl text-yellow-400 mb-12 font-bold">DETALLE DE LA BAZA</h2>
                                    <div className="flex gap-20 items-center mb-12 w-full justify-center">
                                        <div className="flex flex-col items-center"><Card card={modalTrick.aiCard} disabled isAi /><span className="text-2xl text-red-400 mt-8 font-bold bg-black px-4 py-1 rounded">RIVAL</span></div>
                                        <div className="text-6xl text-gray-500 font-bold opacity-50">VS</div>
                                        <div className="flex flex-col items-center"><Card card={modalTrick.pCard} disabled isAi /><span className="text-2xl text-blue-400 mt-8 font-bold bg-black px-4 py-1 rounded">TÚ</span></div>
                                    </div>
                                    <div className="text-3xl bg-black bg-opacity-50 p-6 pixel-border w-full text-center">Ganador: <span className={modalTrick.winner === 'player' ? 'text-green-400 font-bold' : 'text-red-500 font-bold'}>{modalTrick.winner === 'player' ? 'TÚ (+'+modalTrick.totalPuntos+' pts)' : 'RIVAL'}</span></div>
                                    <button onClick={() => { setShowLastTrick(false); setModalTrick(null); }} className="mt-12 bg-red-600 px-12 py-4 pixel-border font-bold text-2xl">CERRAR</button>
                                </div>
                            </div>
                        )}

                        {showDeckModal && (
                            <div className="absolute inset-0 bg-black bg-opacity-95 z-[100] flex flex-col items-center justify-center">
                                <div className="max-w-[1500px] w-full flex flex-col items-center">
                                    <div className="flex justify-between items-center w-full mb-8 px-12"><h2 className="text-6xl text-yellow-400 font-bold">REGISTRO DEL MAZO</h2><button onClick={() => setShowDeckModal(false)} className="bg-red-600 px-8 py-4 pixel-border font-bold text-2xl">CERRAR</button></div>
                                    <div className="flex flex-col gap-4 w-full items-center bg-[#1a2b22] p-8 pixel-border rounded-xl">
                                        {SUITS.map(suit => (
                                            <div key={suit} className="flex flex-row -space-x-8 justify-center w-full relative">
                                                {RANKS.map(rank => {
                                                    const seen = deck.some(c => c.suit === suit && c.rank === rank) || aiHand.some(c => c.suit === suit && c.rank === rank) || (muestra && muestra.suit === suit && muestra.rank === rank);
                                                    return <div key={rank} className={`transition-opacity transform scale-90 ${seen ? 'opacity-100 hover:scale-105 z-10 hover:z-50' : 'opacity-30 grayscale'}`}><Card card={{ suit, rank, fichasActuales: getFichasBase(rank) }} disabled isAi /></div>;
                                                })}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {gameState === 'ROUND_SUMMARY' && roundSummary && (
                            <div className="flex-1 flex flex-col items-center justify-center bg-black bg-opacity-95 z-20">
                                <h1 className="text-[120px] text-yellow-400 mb-8 font-bold animate-pulse">¡COTO SUPERADO!</h1>
                                <div className="bg-[#1a2b22] p-12 pixel-border max-w-3xl w-full flex flex-col items-center mb-12">
                                    <p className="text-4xl text-gray-300 mb-6">Puntuación: <span className="text-blue-400 font-bold">{roundSummary.score}</span> / <span className="text-red-500">{roundSummary.target}</span></p>
                                    <p className="text-4xl text-gray-300 mb-6">Tiradas sobrantes: <span className="text-green-400 font-bold">{roundSummary.tiradasLeft}</span></p>
                                    <p className="text-5xl text-yellow-400 mt-6 font-bold bg-black px-8 py-4 pixel-border-sm">Recompensa: +{roundSummary.monedasEarned} 💰</p>
                                </div>
                                <button onClick={() => setGameState('SHOP')} className="bg-blue-600 px-16 py-8 pixel-border text-5xl font-bold">IR A LA TIENDA ➔</button>
                            </div>
                        )}

                        {gameState === 'MENU' && (
                            <div className="flex-1 flex flex-col items-center justify-center bg-black bg-opacity-80 z-20 p-8">
                                <div className="bg-[#0f1a14] p-16 pixel-border border-green-600 max-w-5xl w-full text-center shadow-[0_0_50px_rgba(22,163,74,0.4)]">
                                    <h1 className="text-[140px] text-yellow-400 mb-6 font-bold leading-none">REBACLATRO</h1>
                                    <p className="text-3xl text-green-400 mb-12 font-bold tracking-widest">EL ROGUELIKE DE BARAJA ESPAÑOLA</p>
                                    <div className="text-2xl text-gray-300 mb-16 text-left bg-black bg-opacity-50 p-10 pixel-border-sm leading-relaxed mx-auto w-4/5">
                                        <ul className="list-disc pl-8 space-y-4">
                                            <li><strong>Arrastre:</strong> En últimas, hay que asistir al palo o tirar triunfo.</li>
                                            <li><strong>El Cau:</strong> Ganar con el mismo número que la Muestra triplica los puntos.</li>
                                            <li><strong>Bonus:</strong> Cada 100 puntos consigues +1 Jugada y +1 Descarte extra.</li>
                                        </ul>
                                    </div>
                                    <button onClick={startGame} className="bg-green-600 px-16 py-8 pixel-border text-5xl font-bold animate-pulse">REPARTIR CARTAS</button>
                                </div>
                            </div>
                        )}

                        {gameState === 'GAMEOVER' && <div className="flex-1 flex flex-col items-center justify-center bg-black bg-opacity-95 z-20"><h1 className="text-[150px] text-red-600 mb-8 font-bold">AL POZO</h1><p className="text-4xl text-gray-300 mb-16">Te quedaste sin tiradas en el Coto {round}.</p><button onClick={startGame} className="bg-yellow-600 text-black px-16 py-8 pixel-border text-4xl font-bold">VOLVER A INTENTAR</button></div>}
                        {gameState === 'VICTORY' && <div className="flex-1 flex flex-col items-center justify-center bg-black bg-opacity-95 z-20"><h1 className="text-[120px] text-yellow-400 mb-8 font-bold animate-cau text-center">¡ERES EL REY<br/>DEL CAU!</h1><p className="text-4xl text-gray-300 mb-16">Has arruinado al pueblo ganando todos los cotos.</p><button onClick={startGame} className="bg-green-600 px-16 py-8 pixel-border text-4xl font-bold">JUGAR OTRA PARTIDA</button></div>}
                    </div>
                </div>
            );
        }

        // ¡ESTO ES VITAL PARA QUE SE MUESTRE EN EL NAVEGADOR!
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
