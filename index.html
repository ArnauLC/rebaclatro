        const { useState, useEffect, useCallback } = React;

        function useLocalStorage(key, initialValue) {
            const [value, setValue] = useState(() => {
                try {
                    const item = window.localStorage.getItem(key);
                    return item ? JSON.parse(item) : initialValue;
                } catch (error) {
                    console.error(error);
                    return initialValue;
                }
            });

            useEffect(() => {
                try {
                    window.localStorage.setItem(key, JSON.stringify(value));
                } catch (error) {
                    console.error(error);
                }
            }, [key, value]);

            return [value, setValue];
        }

        const FormatText = ({ text, className = "text-white" }) => {
            if (!text || typeof text !== 'string') return <span className={className}>{text}</span>;
            const parts = text.split(/(Ors|Copes|Espases|Bastos)/gi);
            return (
                <span className={className}>
                    {parts.map((part, i) => {
                        const lower = part.toLowerCase();
                        if (lower === 'ors') return <span key={i} className="text-yellow-400 font-bold">{part}</span>;
                        if (lower === 'copes') return <span key={i} className="text-red-500 font-bold">{part}</span>;
                        if (lower === 'espases') return <span key={i} className="text-blue-400 font-bold">{part}</span>;
                        if (lower === 'bastos') return <span key={i} className="text-green-500 font-bold">{part}</span>;
                        return part;
                    })}
                </span>
            );
        };

        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };
            }
            static getDerivedStateFromError(error) {
                return { hasError: true, error };
            }
            render() {
                if (this.state.hasError) {

                            <p className="text-3xl bg-black p-8 border-4 border-black shadow-[8px_8px_0_0_#000] text-yellow-400 mb-8 max-w-5xl">
                                {this.state.error && this.state.error.toString()}
                            </p>
                        </div>
                    );
                }
                return this.props.children;

            const [deck, setDeck] = useState([]);
            const [discardPile, setDiscardPile] = useState([]);
            const [playerHand, setPlayerHand] = useState([]);
            const [aiHand, setAiHand] = useState([]);
            const [selectedCards, setSelectedCards] = useState([]); 
            const [muestra, setMuestra] = useState(null);
            const [trumpSuit, setTrumpSuit] = useState(null); 
            const [currentAiCard, setCurrentAiCard] = useState(null);
            const [playedPlayerCard, setPlayedPlayerCard] = useState(null);
            const [turnLeader, setTurnLeader] = useState('player'); 
            
            const [showDeckModal, setShowDeckModal] = useState(false);
            const [draggedIndex, setDraggedIndex] = useState(null);
            const [activeActionId, setActiveActionId] = useState(null);
            const [extraPlayMsg, setExtraPlayMsg] = useState(false);
            const [showLastTrick, setShowLastTrick] = useState(false);
            
            const [playerLastTrick, setPlayerLastTrick] = useState(null);
            const [aiLastTrick, setAiLastTrick] = useState(null);
            const [modalTrick, setModalTrick] = useState(null);

            const [events, setEvents] = useState([]);
            const [objectes, setObjectes] = useState([]);
            const [begudes, setBegudes] = useState([]); 
            
            const [shopEvents, setShopEvents] = useState([null, null, null, null, null]);
            const [shopMixed, setShopMixed] = useState([null, null, null, null, null]);
            
            const [rankUpgrades, setRankUpgrades] = useState({});

            const [baseMult, setBaseMult] = useState(1);
            const [tempMult, setTempMult] = useState(0); 
            const [tempFichas, setTempFichas] = useState(0); 
            const [fichasAcumuladas, setFichasAcumuladas] = useState(0); 
            
            const [cantesRealizados, setCantesRealizados] = useState([]); 
            const [aiCantesRealizados, setAiCantesRealizados] = useState([]);
            const [aiPenaltyMult, setAiPenaltyMult] = useState(1); 
            const [hasWonTrick, setHasWonTrick] = useState(false);

            const [bazaResult, setBazaResult] = useState(null); 
            
            const [sortMethod, setSortMethod] = useState('none'); 

            const hasSavedGame = !!localStorage.getItem('rebaclatro_savegame');

            useEffect(() => {
                if (['SHOP', 'PLAYING', 'RESOLVING', 'ROUND_SUMMARY', 'ROUTE_MAP', 'SELECT_TRUMP', 'SELECT_FACTION'].includes(gameState) && faction !== null) {
                    const save = {
                        gameState, faction, round, score, targetScore, monedas,
                        tiradasLeft, descartesLeft, deck, discardPile, playerHand,
                        aiHand, muestra, trumpSuit, currentAiCard, playedPlayerCard,
                        turnLeader, events, objectes, begudes, shopEvents, shopMixed,
                        rankUpgrades, baseMult, tempMult, tempFichas, fichasAcumuladas,
                        cantesRealizados, aiCantesRealizados, aiPenaltyMult, hasWonTrick,
                        sortMethod
                    };
                    localStorage.setItem('rebaclatro_savegame', JSON.stringify(save));
                } else if (['GAMEOVER', 'VICTÒRIA', 'DERROTA'].includes(gameState)) {
                    localStorage.removeItem('rebaclatro_savegame');
                }
            }, [gameState, faction, round, score, targetScore, monedas, tiradasLeft, descartesLeft, deck, discardPile, playerHand, aiHand, muestra, trumpSuit, currentAiCard, playedPlayerCard, turnLeader, events, objectes, begudes, shopEvents, shopMixed, rankUpgrades, baseMult, tempMult, tempFichas, fichasAcumuladas, cantesRealizados, aiCantesRealizados, aiPenaltyMult, hasWonTrick, sortMethod]);

            const loadSavedGame = () => {
                try {
                    const saved = JSON.parse(localStorage.getItem('rebaclatro_savegame'));
                    if (saved) {
                        setFaction(saved.faction); setRound(saved.round); setScore(saved.score);
                        setTargetScore(saved.targetScore); setMonedas(saved.monedas);
                        setTiradasLeft(saved.tiradasLeft); setDescartesLeft(saved.descartesLeft);
                        setDeck(saved.deck); setDiscardPile(saved.discardPile);
                        setPlayerHand(saved.playerHand); setAiHand(saved.aiHand);
                        setMuestra(saved.muestra); setTrumpSuit(saved.trumpSuit);
                        setCurrentAiCard(saved.currentAiCard); setPlayedPlayerCard(saved.playedPlayerCard);
                        setTurnLeader(saved.turnLeader); setEvents(saved.events);
                        setObjectes(saved.objectes); setBegudes(saved.begudes);
                        setShopEvents(saved.shopEvents || [null,null,null,null,null]); 
                        setShopMixed(saved.shopMixed || [null,null,null,null,null]);
                        setRankUpgrades(saved.rankUpgrades); setBaseMult(saved.baseMult);
                        setTempMult(saved.tempMult); setTempFichas(saved.tempFichas);
                        setFichasAcumuladas(saved.fichasAcumuladas); setCantesRealizados(saved.cantesRealizados);
                        setAiCantesRealizados(saved.aiCantesRealizados); setAiPenaltyMult(saved.aiPenaltyMult);
                        setHasWonTrick(saved.hasWonTrick); setSortMethod(saved.sortMethod || 'none');
                        setGameState(saved.gameState);
                    }
                } catch (e) {
                    console.error("Error carregant la partida guardada", e);
                }
            };

            const quitToMenu = () => {
                localStorage.removeItem('rebaclatro_savegame');
                setGameState('MENU');
                setFaction(null);
                setShowOptionsModal(false);
            };

            const getEnemiesList = () => {
                if (faction === 'cristia') return ['Guerrer Moro', 'Sargent Moro', 'Alferes Moro', 'Capità Moro', 'Al-Azraq'];
                if (faction === 'moro') return ['Guerrer Cristià', 'Sargent Cristià', 'Alferes Cristià', 'Capità Cristià', 'Jaume I'];
                return [];
            };

            const handleGlobalClick = () => { setActiveActionId(null); };

            const getActualCost = (item, type) => {
                if (!item) return 0;
                if (type === 'beguda' && events.some(r => r.id === 'r21')) return Math.ceil(item.cost / 2);
                if (type === 'objecte' && events.some(r => r.id === 'r22')) return Math.ceil(item.cost / 2);
                return item.cost;
            };

            const getCardFichas = (card, activeEvents) => {
                let f = card.fichasBase;
                if (activeEvents.some(r=>r.id==='r15') && card.rank === 11) return 13;
                if (activeEvents.some(r=>r.id==='r11') && [10,11,12].includes(card.rank)) f *= 2;
                return f;
            };

            const isTriunfo = (suit, activeEvents) => {
                if (!trumpSuit) return false;
                if (suit === trumpSuit) return true;
                if (suit === 'Copes' && activeEvents.some(r => r.id === 'r6')) return true; 
                return false;
            };

            const getPoderModificado = (card, activeEvents) => {
                let p = getPoder(card.rank);
                if (activeEvents.some(r=>r.id==='r17')) p = 9 - p; 
                if (card.rank === 1 && activeEvents.some(r=>r.id==='r5')) p += 5;
                if (card.rank === 11 && activeEvents.some(r=>r.id==='r15')) p = 99;
                return p;
            };

            const determineWinner = (leadCard, followCard, activeEvents) => {
                if (activeEvents.some(r=>r.id==='r16') && leadCard.rank === followCard.rank) return 'follow';
                const leadIsTriunfo = isTriunfo(leadCard.suit, activeEvents);
                const followIsTriunfo = isTriunfo(followCard.suit, activeEvents);
                const leadPoder = getPoderModificado(leadCard, activeEvents);
                const followPoder = getPoderModificado(followCard, activeEvents);
                
                if (leadIsTriunfo && !followIsTriunfo) return 'lead';
                if (!leadIsTriunfo && followIsTriunfo) return 'follow';
                if (leadIsTriunfo && followIsTriunfo) return leadPoder > followPoder ? 'lead' : 'follow';
                if (followCard.suit === leadCard.suit) return leadPoder > followPoder ? 'lead' : 'follow';
                return 'lead'; 
            };

            const getSortedHand = (hand, method) => {
                if (method === 'suit') {
                    const order = ['Ors', 'Copes', 'Espases', 'Bastos'];
                    return [...hand].sort((a, b) => {
                        if (isTriunfo(a.suit, events) && !isTriunfo(b.suit, events)) return -1;
                        if (!isTriunfo(a.suit, events) && isTriunfo(b.suit, events)) return 1;
                        if (a.suit !== b.suit) return order.indexOf(a.suit) - order.indexOf(b.suit);
                        return getPoder(b.rank) - getPoder(a.rank);
                    });
                }
                if (method === 'power') {
                    return [...hand].sort((a, b) => {
                        if (isTriunfo(a.suit, events) && !isTriunfo(b.suit, events)) return -1;
                        if (!isTriunfo(a.suit, events) && isTriunfo(b.suit, events)) return 1;
                        if (getPoder(a.rank) !== getPoder(b.rank)) return getPoder(b.rank) - getPoder(a.rank);
                        return SUITS.indexOf(a.suit) - SUITS.indexOf(b.suit);
                    });
                }
                return hand;
            };

            const sortHandBySuit = () => { setSortMethod('suit'); setPlayerHand(getSortedHand(playerHand, 'suit')); };
            const sortHandByPower = () => { setSortMethod('power'); setPlayerHand(getSortedHand(playerHand, 'power')); };

            const createDeck = () => {
                let newDeck = [];
                SUITS.forEach(suit => {
                    RANKS.forEach(rank => {
                        const upgrade = rankUpgrades[rank] || 0;
                        newDeck.push({ 
                            id: `${suit}-${rank}-${Math.random()}`, 
                            suit, rank, fichasBase: getFichasBase(rank) + upgrade, revealed: false 
                        });
                    });
                });
                return newDeck.sort(() => Math.random() - 0.5);
            };

            const startGame = (chosenFaction) => {
                setFaction(chosenFaction);
                setRound(1); setTargetScore(TARGETS[0]); setMonedas(10); 
                setEvents([]); setObjectes([]); setBegudes([]); setBaseMult(1); setTempMult(0);
                setTempFichas(0); setFichasAcumuladas(0); setActiveActionId(null);
                setPlayerLastTrick(null); setAiLastTrick(null); setAiCantesRealizados([]);
                setAiPenaltyMult(1); setHasWonTrick(false); setRankUpgrades({});
                
                generateShop(chosenFaction); 
                setGameState('SHOP'); 
                setShowOptionsModal(false);
            };

            const initRound = (r) => {
                let newDeck = createDeck();
                let m = newDeck.splice(0, 1)[0];
                let pHand = newDeck.splice(0, 6);
                let aHand = newDeck.splice(0, 6);
                
                setDeck(newDeck); setDiscardPile([]); 
                setPlayerHand(getSortedHand(pHand, sortMethod));
                setMuestra(m); setTurnLeader('ai');
                
                setScore(0); setTiradasLeft(10); setDescartesLeft(3);
                setSelectedCards([]); setPlayedPlayerCard(null); setBazaResult(null);
                setFichasAcumuladas(0); setCantesRealizados([]); setAiCantesRealizados([]);
                setAiPenaltyMult(1); setHasWonTrick(false); 
                
                let initialMult = events.some(e => e.id === 'r23') ? 5 : 1;
                setBaseMult(initialMult); 
                setTempMult(0); setTempFichas(0); setActiveActionId(null);
                setPlayerLastTrick(null); setAiLastTrick(null);

                if (events.some(e => e.id === 'r24')) {
                    setTrumpSuit(null);
                    setCurrentAiCard(null);
                    setAiHand(aHand);
                    setGameState('SELECT_TRUMP');
                } else {
                    setTrumpSuit(m.suit);
                    let nextAiPlay = aiLeadLogic(aHand, m.suit, events);
                    if(nextAiPlay) aHand = aHand.filter(c => c.id !== nextAiPlay.id);
                    setCurrentAiCard(nextAiPlay);
                    setAiHand(aHand);
                    setGameState('PLAYING');
                }
            };

            const selectTrumpSuit = (suit) => {
                setTrumpSuit(suit);
                let currentAHand = [...aiHand];
                let nextAiPlay = aiLeadLogic(currentAHand, suit, events);
                if (nextAiPlay) {
                    currentAHand = currentAHand.filter(c => c.id !== nextAiPlay.id);
                    setCurrentAiCard(nextAiPlay);
                    setAiHand(currentAHand);
                }
                setPlayerHand(getSortedHand(playerHand, sortMethod));
                setGameState('PLAYING');
            };

            const drawCards = (currentDeck, amount, currentMuestra) => {
                let drawn = []; let newDeck = [...currentDeck]; let newMuestra = currentMuestra;
                for(let i=0; i<amount; i++) {
                    if (newDeck.length === 0) {
                        if (newMuestra) { drawn.push(newMuestra); newMuestra = null; } 
                        else break;
                    } else drawn.push(newDeck.shift());
                }
                return { drawn, newDeck, newMuestra };
            };

            const aiLeadLogic = (hand, tSuit, activeEvents) => {
                if (hand.length === 0) return null;
                let nonTrumps = hand.filter(c => !isTriunfo(c.suit, activeEvents));
                if (nonTrumps.length > 0) {
                    let blancas = nonTrumps.filter(c => getCardFichas(c, activeEvents) === 0);
                    if (blancas.length > 0) return blancas.sort((a, b) => getPoderModificado(a, activeEvents) - getPoderModificado(b, activeEvents))[0]; 
                    return nonTrumps.sort((a, b) => {
                        let fa = getCardFichas(a, activeEvents), fb = getCardFichas(b, activeEvents);
                        if (fa !== fb) return fa - fb;
                        return getPoderModificado(a, activeEvents) - getPoderModificado(b, activeEvents);
                    })[0];
                } else {
                    let trumps = [...hand].sort((a, b) => getPoderModificado(a, activeEvents) - getPoderModificado(b, activeEvents));
                    return trumps[0];
                }
            };

            const aiFollowLogic = (hand, leadCard, tSuit, isUltimas, activeEvents) => {
                if (hand.length === 0) return null;
                let validCards = hand;
                if (isUltimas && !activeEvents.some(r=>r.id==='r20')) {
                    const hasLeadSuit = hand.some(c => c.suit === leadCard.suit);
                    const hasTrump = hand.some(c => isTriunfo(c.suit, activeEvents));
                    if (hasLeadSuit) validCards = hand.filter(c => c.suit === leadCard.suit);
                    else if (hasTrump) validCards = hand.filter(c => isTriunfo(c.suit, activeEvents));
                }
                let winningCards = validCards.filter(c => determineWinner(leadCard, c, activeEvents) === 'follow');
                let losingCards = validCards.filter(c => determineWinner(leadCard, c, activeEvents) === 'lead');

                const getBestLosingCard = () => {
                    let nonTrumps = losingCards.filter(c => !isTriunfo(c.suit, activeEvents));
                    let pool = nonTrumps.length > 0 ? nonTrumps : losingCards;
                    return pool.sort((a, b) => {
                        let fa = getCardFichas(a, activeEvents), fb = getCardFichas(b, activeEvents);
                        if (fa !== fb) return fa - fb;
                        return getPoderModificado(a, activeEvents) - getPoderModificado(b, activeEvents);
                    })[0];
                };

                if (winningCards.length > 0) {
                    const isJuicyTrick = getCardFichas(leadCard, activeEvents) >= 3; 
                    let winningTrumps = winningCards.filter(c => isTriunfo(c.suit, activeEvents));
                    let winningNonTrumps = winningCards.filter(c => !isTriunfo(c.suit, activeEvents));

                    if (isJuicyTrick) {
                        if (winningNonTrumps.length > 0) return winningNonTrumps.sort((a, b) => getPoderModificado(a, activeEvents) - getPoderModificado(b, activeEvents))[0];
                        return winningTrumps.sort((a, b) => getPoderModificado(a, activeEvents) - getPoderModificado(b, activeEvents))[0];
                    } else {
                        if (winningNonTrumps.length > 0) return winningNonTrumps.sort((a, b) => getPoderModificado(a, activeEvents) - getPoderModificado(b, activeEvents))[0];
                        else {
                            if (losingCards.length > 0) return getBestLosingCard();
                            return winningTrumps.sort((a, b) => getPoderModificado(a, activeEvents) - getPoderModificado(b, activeEvents))[0];
                        }
                    }
                }
                return getBestLosingCard();
            };

            const getPosiblesCantes = () => {
                if (events.some(r=>r.id==='r23')) return [];
                if (!hasWonTrick && !events.some(r=>r.id==='r10')) return [];
                let cantes = [];
                const figura = events.some(r=>r.id==='r18') ? 11 : 10; 
                SUITS.forEach(suit => {
                    if (cantesRealizados.includes(suit)) return;
                    const tieneRey = playerHand.some(c => c.suit === suit && c.rank === 12);
                    const tieneFigura = playerHand.some(c => c.suit === suit && c.rank === figura);
                    if (tieneRey && tieneFigura) {
                        cantes.push({ suit, tipo: isTriunfo(suit, events) ? '40' : '20', nombre: isTriunfo(suit, events) ? `40 en ${suit}` : `20 en ${suit}` });
                    }
                });
                return cantes;
            };

            const cantar = (cante) => {
                setCantesRealizados([...cantesRealizados, cante.suit]);
                let multBonus = cante.tipo === '40' ? 4 : 2;
                if (events.some(r => r.id === 'r4')) multBonus *= 2; 
                setBaseMult(m => m + multBonus); 
                if (events.some(r => r.id === 'r10')) setFichasAcumuladas(f => f + 10);
                setBazaResult({ message: `¡CANTES LES ${cante.nombre.toUpperCase()}! (+${multBonus} Mult)`, winner: 'canto', bac: false });
                setTimeout(() => setBazaResult(null), 1500);
            };

            const checkAiCantes = (hand, tSuit, currentCantes, activeEvents) => {
                if (activeEvents.some(r=>r.id==='r23')) return null;
                const figura = activeEvents.some(r=>r.id==='r18') ? 11 : 10;
                for (let suit of SUITS) {
                    if (!currentCantes.includes(suit)) {
                        const tieneRey = hand.some(c => c.suit === suit && c.rank === 12);
                        const tieneFigura = hand.some(c => c.suit === suit && c.rank === figura);
                        if (tieneRey && tieneFigura) return { suit, is40: isTriunfo(suit, activeEvents) };
                    }
                }
                return null;
            };

            const toggleCardSelection = (card) => {
                if (selectedCards.find(c => c.id === card.id)) setSelectedCards(selectedCards.filter(c => c.id !== card.id));
                else if (selectedCards.length < 3) setSelectedCards([...selectedCards, card]);
            };

            const handleDiscard = () => {
                if (descartesLeft <= 0 || selectedCards.length === 0 || (deck.length === 0 && !muestra)) return;
                let currentHand = [...playerHand];
                if (events.some(r => r.id === 'r7')) {
                    currentHand = currentHand.map(c => !selectedCards.find(sc => sc.id === c.id) ? { ...c, bonusR7: (c.bonusR7 || 0) + 5 } : c);
                }
                let newHand = currentHand.filter(c => !selectedCards.find(sc => sc.id === c.id));
                let discarded = currentHand.filter(c => selectedCards.find(sc => sc.id === c.id));
                let { drawn, newDeck, newMuestra } = drawCards(deck, 6 - newHand.length, muestra);
                setDeck(newDeck); setDiscardPile([...discardPile, ...discarded]);
                setMuestra(newMuestra); setPlayerHand(getSortedHand([...newHand, ...drawn], sortMethod));
                setSelectedCards([]); setDescartesLeft(d => d - 1);
            };

            const consumeObjecte = (index) => {
                if (gameState !== 'PLAYING') return;
                const obj = objectes[index];
                if (obj.efecte.mult) setTempMult(m => m + obj.efecte.mult);
                if (obj.efecte.fichas) setTempFichas(f => f + obj.efecte.fichas);
                if (obj.efecte.tiradas) setTiradasLeft(t => t + obj.efecte.tiradas);
                if (obj.efecte.descartes) setDescartesLeft(d => d + obj.efecte.descartes);
                
                setBazaResult({ message: `¡Utilitzes ${obj.name}!`, winner: 'canto', bac: false });
                setTimeout(() => setBazaResult(null), 1200);
                setObjectes(o => o.filter((_, i) => i !== index));
            };

            const consumeBeguda = (index) => {
                if (gameState !== 'PLAYING') return;
                const beguda = begudes[index];
                const rank = beguda.rank;
                const amount = beguda.upgradeAmount;

                setRankUpgrades(prev => ({ ...prev, [rank]: (prev[rank] || 0) + amount }));

                const applyUpgrade = c => c.rank === rank ? { ...c, fichasBase: c.fichasBase + amount } : c;
                setDeck(deck.map(applyUpgrade));
                setPlayerHand(playerHand.map(applyUpgrade));
                setAiHand(aiHand.map(applyUpgrade));
                setDiscardPile(discardPile.map(applyUpgrade));
                if (muestra && muestra.rank === rank) setMuestra(applyUpgrade(muestra));
                
                setBazaResult({ message: `¡Tots els ${rank} pugen +${amount} Fitxes!`, winner: 'canto', bac: false });
                setTimeout(() => setBazaResult(null), 1500);

                let newB = [...begudes];
                if (newB[index].count > 1) {
                    newB[index].count -= 1;
                } else {
                    newB.splice(index, 1);
                }
                setBegudes(newB);
            };

            const playCard = (pCard) => {
                if (tiradasLeft <= 0) return;
                const isUltimas = (deck.length === 0 && !muestra) && !events.some(r=>r.id==='r20');
                if (isUltimas && turnLeader === 'ai' && currentAiCard) {
                    const hasSuit = playerHand.some(c => c.suit === currentAiCard.suit);
                    const hasTrump = playerHand.some(c => isTriunfo(c.suit, events));
                    let valid = true;
                    if (hasSuit && pCard.suit !== currentAiCard.suit) valid = false;
                    else if (!hasSuit && hasTrump && !isTriunfo(pCard.suit, events)) valid = false;
                    if (!valid) {
                        setBazaResult({ message: "¡ASSISTEIX AL PAL O TIRA TRIOMF!", winner: 'error', bac: false });
                        setTimeout(() => setBazaResult(null), 1500);
                        return;
                    }
                }
                const newTiradas = tiradasLeft - 1;
                setTiradasLeft(newTiradas); setPlayedPlayerCard(pCard);
                setSelectedCards([]); setActiveActionId(null); setGameState('RESOLVING');
                
                let currentAiHand = [...aiHand];
                let aiCard, winner;
                if (turnLeader === 'ai') {
                    aiCard = currentAiCard;
                    winner = determineWinner(aiCard, pCard, events) === 'lead' ? 'ai' : 'player';
                } else {
                    aiCard = aiFollowLogic(currentAiHand, pCard, trumpSuit, isUltimas, events);
                    setCurrentAiCard(aiCard);
                    currentAiHand = currentAiHand.filter(c => c.id !== aiCard.id);
                    winner = determineWinner(pCard, aiCard, events) === 'lead' ? 'player' : 'ai';
                }

                let fichasP = getCardFichas(pCard, events) + (pCard.bonusR7 || 0);
                let fichasA = aiCard ? getCardFichas(aiCard, events) : 0;
                
                if (events.some(r=>r.id==='r12')) {
                    if ([2,4,5,6,7].includes(pCard.rank)) fichasP += 1;
                    if (aiCard && [2,4,5,6,7].includes(aiCard.rank)) fichasA += 1;
                }

                let fichasBase = fichasP + fichasA + fichasAcumuladas + tempFichas;
                if (pCard.suit === 'Ors' && events.some(r => r.id === 'r2')) fichasBase += 15;
                if (events.some(r=>r.id==='r13') && ['Copes', 'Espases'].includes(pCard.suit)) fichasBase *= 2;
                if (events.some(r=>r.id==='r14') && ['Ors', 'Bastos'].includes(pCard.suit)) fichasBase *= 2;
                
                let isBac = false;
                let pMult = (baseMult + tempMult) * aiPenaltyMult; 
                let xMult = 1, message = '';
                let nextAiPenalty = 1;

                if (winner === 'player') {
                    setHasWonTrick(true);
                    if (pCard.rank === (muestra ? muestra.rank : -1)) { isBac = true; xMult = 3; message = "¡BAC! i ¡REBAC!"; }
                    else message = "¡BASSA GUANYADA!";
                    if ([2,4,5,6,7].includes(pCard.rank) && events.some(r => r.id === 'r1')) setBaseMult(m => m + 1);
                    if ([10,11,12].includes(pCard.rank) && events.some(r => r.id === 'r8')) setMonedas(m => m + 2);
                    if (events.some(r=>r.id==='r19')) setDescartesLeft(d => d + 1);
                    setFichasAcumuladas(0);
                    setPlayerLastTrick({ pCard, aiCard, winner, totalPuntos: Math.floor(fichasBase * pMult * xMult) });
                } else {
                    fichasBase = 0; message = "Bassa Perduda";
                    if (events.some(r => r.id === 'r3')) setFichasAcumuladas(f => f + fichasA + fichasP);
                    setAiLastTrick({ pCard, aiCard, winner, totalPuntos: 0 });

                    const aiCante = checkAiCantes(currentAiHand, trumpSuit, aiCantesRealizados, events);
                    if (aiCante) {
                        const newCantes = [...aiCantesRealizados, aiCante.suit];
                        setAiCantesRealizados(newCantes);
                        const penalty = aiCante.is40 ? 0.5 : 0.75;
                        nextAiPenalty = penalty;
                        message = `¡L'IA CANTA LES ${aiCante.is40 ? '40' : '20'} EN ${aiCante.suit.toUpperCase()}! (El teu pròxim mult x${penalty})`;
                    }
                }
                const totalPuntos = Math.floor(fichasBase * pMult * xMult);
                setBazaResult({ winner, message, fichas: fichasBase, mult: Number(pMult.toFixed(2)), xMult, total: totalPuntos, bac: isBac });
                
                let newDiscardPile = [...discardPile, pCard, aiCard];
                setDiscardPile(newDiscardPile);
                setTempMult(0); setTempFichas(0);
                setAiPenaltyMult(nextAiPenalty);
                
                setTimeout(() => {
                    const newScore = score + totalPuntos;
                    const extraRes = Math.max(0, Math.floor(newScore / 50) - Math.floor(score / 50));
                    if (extraRes > 0) { setTiradasLeft(t => t + extraRes); setDescartesLeft(d => d + extraRes); setExtraPlayMsg(true); setTimeout(() => setExtraPlayMsg(false), 2000); }
                    setScore(newScore); setTurnLeader(winner);
                    
                    let newPHand = playerHand.filter(c => c.id !== pCard.id);
                    let nextPHand = [], nextAHand = [], firstDraw, secondDraw;
                    if (winner === 'player') {
                        firstDraw = drawCards(deck, 6 - newPHand.length, muestra);
                        secondDraw = drawCards(firstDraw.newDeck, 6 - currentAiHand.length, firstDraw.newMuestra);
                        nextPHand = [...newPHand, ...firstDraw.drawn]; nextAHand = [...currentAiHand, ...secondDraw.drawn];
                    } else {
                        firstDraw = drawCards(deck, 6 - currentAiHand.length, muestra);
                        secondDraw = drawCards(firstDraw.newDeck, 6 - newPHand.length, firstDraw.newMuestra);
                        nextAHand = [...currentAiHand, ...firstDraw.drawn]; nextPHand = [...newPHand, ...secondDraw.drawn];
                    }

                    if (nextPHand.length === 0 && nextAHand.length === 0 && newScore < targetScore && (newTiradas + extraRes) > 0) {
                        let freshDeck = [...newDiscardPile].sort(() => Math.random() - 0.5);
                        let m = freshDeck.splice(0, 1)[0];
                        nextPHand = freshDeck.splice(0, 6); nextAHand = freshDeck.splice(0, 6);
                        setDeck(freshDeck); setDiscardPile([]); if (m) { setMuestra(m); }
                    } else { setDeck(secondDraw.newDeck); setMuestra(secondDraw.newMuestra); }
                    
                    setPlayerHand(getSortedHand(nextPHand, sortMethod));
                    
                    if (newScore >= targetScore) {
                        const finalCoins = 4 + Math.floor((newTiradas + extraRes) / 2);
                        setMonedas(m => m + finalCoins);
                        setRoundSummary({ score: newScore, target: targetScore, tiradasLeft: newTiradas + extraRes, descartesLeft: descartesLeft + extraRes, monedasEarned: finalCoins });
                        setGameState('ROUND_SUMMARY');
                    } else if ((newTiradas + extraRes) <= 0) setGameState('DERROTA');
                    else {
                        if (winner === 'ai') {
                            let nextAiPlay = aiLeadLogic(nextAHand, trumpSuit, events);
                            if (nextAiPlay) { nextAHand = nextAHand.filter(c => c.id !== nextAiPlay.id); setCurrentAiCard(nextAiPlay); }
                        } else setCurrentAiCard(null);
                        setAiHand(nextAHand); setPlayedPlayerCard(null); setBazaResult(null); setGameState('PLAYING');
                    }
                }, 1800);
            };

            const handlePlayCardBtn = () => { if (tiradasLeft > 0 && selectedCards.length === 1) playCard(selectedCards[0]); };
            const handleDragStart = (e, i) => { setDraggedIndex(i); if (e.dataTransfer) { e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', i.toString()); } };
            const handleDropInHand = (e, i) => { 
                e.preventDefault(); 
                if (draggedIndex !== null && draggedIndex !== i) { 
                    const newHand = [...playerHand]; 
                    const [dragged] = newHand.splice(draggedIndex, 1); 
                    newHand.splice(i, 0, dragged); 
                    setPlayerHand(newHand); 
                    setSortMethod('none');
                } 
                setDraggedIndex(null); 
            };

            const generateShop = (currentFaction) => {
                let sE = new Array(5).fill(null);
                let sM = new Array(5).fill(null);
                
                let avE = EVENTS_DB.filter(e => !events.some(my => my.id === e.id));
                let avO = OBJECTES_DB.filter(o => o.faction === currentFaction && !objectes.some(my => my.id === o.id)).map(o => ({...o, type: 'objecte'}));
                let avB = [...BEGUDES_DB].map(b => ({...b, type: 'beguda'}));
                
                for(let i=0; i<5; i++) {
                    if(avE.length) sE[i] = { ...avE.splice(Math.floor(Math.random() * avE.length), 1)[0], uId: Math.random() };
                }
                
                let mixedPool = [];
                if (avO.length) mixedPool.push({ ...avO.splice(Math.floor(Math.random() * avO.length), 1)[0], uId: Math.random() });
                if (avB.length) mixedPool.push({ ...avB.splice(Math.floor(Math.random() * avB.length), 1)[0], uId: Math.random() });
                
                let remainingMixed = [...avO, ...avB].sort(() => Math.random() - 0.5);
                while (mixedPool.length < 5 && remainingMixed.length > 0) {
                    mixedPool.push({ ...remainingMixed.shift(), uId: Math.random() });
                }
                
                mixedPool.sort(() => Math.random() - 0.5);
                for(let i=0; i<5; i++) {
                    if(mixedPool[i]) sM[i] = mixedPool[i];
                }
                
                setShopEvents(sE); setShopMixed(sM);
            };

            const buyItem = (item, index, type) => { 
                const actualCost = getActualCost(item, type);
                if (monedas >= actualCost) { 
                    if (type === 'event' && events.length < 6) { 
                        setMonedas(m => m - actualCost); setEvents([...events, item]); 
                        let n = [...shopEvents]; n[index] = null; setShopEvents(n); 
                    }
                    else if (type === 'objecte' && objectes.length < 3) { 
                        setMonedas(m => m - actualCost); setObjectes([...objectes, item]); 
                        let n = [...shopMixed]; n[index] = null; setShopMixed(n); 
                    }
                    else if (type === 'beguda') { 
                        const existingIndex = begudes.findIndex(b => b.id === item.id);
                        if (existingIndex !== -1) {
                            setMonedas(m => m - actualCost);
                            let newBegudes = [...begudes];
                            newBegudes[existingIndex].count = (newBegudes[existingIndex].count || 1) + 1;
                            setBegudes(newBegudes);
                            let n = [...shopMixed]; n[index] = null; setShopMixed(n);
                        } else if (begudes.length < 3) {
                            setMonedas(m => m - actualCost); 
                            setBegudes([...begudes, { ...item, count: 1 }]); 
                            let n = [...shopMixed]; n[index] = null; setShopMixed(n); 
                        }
                    }

                    if (!unlockedItems.includes(item.id)) setUnlockedItems([...unlockedItems, item.id]);
                } 
            };
            
            const sellItem = (item, index, type) => { 
                const actualCost = getActualCost(item, type);
                setMonedas(m => m + Math.max(1, Math.floor(actualCost / 2))); 
                if (type === 'event') setEvents(events.filter((_, i) => i !== index)); 
                else if (type === 'objecte') setObjectes(objectes.filter((_, i) => i !== index)); 
                else {
                    let newB = [...begudes];
                    if (newB[index].count > 1) newB[index].count -= 1;
                    else newB.splice(index, 1);
                    setBegudes(newB);
                }
            };

            const nextRoundAndShop = () => { 
                if (round >= TARGETS.length) {
                    setGameState('VICTÒRIA'); 
                } else { 
                    setRound(r => r + 1); 
                    setTargetScore(TARGETS[round]); 
                    generateShop(faction); 
                    setGameState('SHOP'); 
                } 
            };

            const handleReroll = () => { if (monedas >= 2) { setMonedas(m => m - 2); generateShop(faction); } };

            const renderCollectionItem = (item, type) => {
                const isUnlocked = unlockedItems.includes(item.id);
                const isObj = type === 'objecte';
                const isDrink = type === 'beguda';
                const bgClass = isDrink ? 'bg-orange-900 border-orange-400' : isObj ? 'bg-blue-900 border-blue-400' : 'bg-purple-900 border-purple-400';
                
                return (
                    <div key={item.id} className={`w-[90px] h-[160px] border-2 flex items-center justify-center p-1 relative group cursor-help ${bgClass}`}>
                        {isUnlocked ? (
                            <img src={isObj ? item.img : `${RELICS_BASE_URL}${item.img}`} className={`w-full h-full ${isObj && item.faction ? 'object-cover' : 'object-contain'}`} />
                        ) : (
                            <div className="text-4xl text-gray-400 font-bold opacity-50">?</div>
                        )}
                        <div className="absolute top-[105%] left-1/2 -translate-x-1/2 w-64 bg-black p-2 pixel-border opacity-0 group-hover:opacity-100 z-[210] pointer-events-none text-center">
                            {isUnlocked ? (
                                <>
                                    <p className="text-yellow-300 font-bold">{item.name}</p>
                                    <p className="text-sm">{item.desc}</p>
                                </>
                            ) : (
                                <p className="text-gray-400 font-bold">DESCONEGUT</p>
                            )}
                        </div>
                    </div>
                );
            };
            
            const renderRunSummary = () => (
                <div className="bg-[#1a2b22] p-8 pixel-border max-w-4xl w-full flex flex-col items-center mb-12 shadow-[0_0_50px_rgba(0,0,0,0.8)] z-10 relative">
                    <h2 className="text-4xl text-yellow-400 mb-6 font-bold border-b-4 border-yellow-600 pb-2">RESUM DE LA PARTIDA</h2>
                    <div className="flex w-full justify-around mb-6">
                        <div className="text-center">
                            <p className="text-gray-400 text-xl">Bàndol</p>
                            <p className="text-3xl text-white font-bold">{faction ? faction.toUpperCase() : ''}</p>
                        </div>
                        <div className="text-center">
                            <p className="text-gray-400 text-xl">Coto Arribat</p>
                            <p className="text-3xl text-white font-bold">{round}</p>
                        </div>
                    </div>
                    
                    <div className="w-full mb-6">
                        <p className="text-gray-400 text-xl mb-2 text-center">Esdeveniments Aconseguits</p>
                        <div className="flex justify-center gap-2 flex-wrap">
                            {events.length > 0 ? events.map(e => (
                                <div key={e.id} className="w-[45px] h-[80px] bg-purple-900 border-2 border-purple-400 flex items-center justify-center group relative cursor-help">
                                    <img src={`${RELICS_BASE_URL}${e.img}`} alt={e.name} className="w-full h-full object-contain p-1" />
                                    <div className="absolute bottom-[110%] w-48 bg-black p-2 pixel-border text-center text-sm opacity-0 group-hover:opacity-100 pointer-events-none z-50">
                                        <span className="text-yellow-300 font-bold">{e.name}</span>
                                    </div>
                                </div>
                            )) : <span className="text-gray-500 font-bold">Cap esdeveniment</span>}
                        </div>
                    </div>

                    <div className="w-full">
                        <p className="text-gray-400 text-xl mb-2 text-center">Millores de Cartes (Begudes)</p>
                        <div className="flex justify-center gap-2 flex-wrap">
                            {Object.keys(rankUpgrades).length > 0 ? Object.entries(rankUpgrades).map(([rank, upg]) => (
                                <div key={rank} className="bg-[#3a2010] border-2 border-orange-500 px-4 py-2 flex flex-col items-center">
                                    <span className="text-xl font-bold text-orange-300">Nº {rank}</span>
                                    <span className="text-green-400 font-bold text-lg">+{upg} Pts</span>
                                </div>
                            )) : <span className="text-gray-500 font-bold">Sense millores</span>}
                        </div>
                    </div>
                </div>
            );

            const playerVisualMult = ((baseMult + tempMult) * aiPenaltyMult).toFixed(2).replace(/\.00$/, '');
            const aiCardsRevealed = events.some(r=>r.id==='r9');
            const enemiesList = getEnemiesList();

            return (
                <div className="fixed inset-0 bg-[#071a10] flex items-center justify-center overflow-hidden">
                    <style>{globalStyles}</style>
                    <div style={{ width: '1920px', height: '1080px', minWidth: '1920px', minHeight: '1080px', transform: `scale(${scale})`, transformOrigin: 'center' }} className="bg-felt text-white flex flex-col relative select-none shadow-[0_0_50px_rgba(0,0,0,1)] border-4 border-black overflow-hidden shrink-0" onClick={handleGlobalClick}>
                        
                        {!showOptionsModal && gameState !== 'MENU' && (
                            <button onClick={() => { setShowOptionsModal(true); setOptionsSubView('main'); }} className="absolute bottom-4 right-4 z-[999] bg-gray-800 text-white px-6 py-3 pixel-border font-bold text-xl hover:bg-gray-700 shadow-xl">
                                ⚙️ OPCIONS
                            </button>
                        )}

                        {showOptionsModal && (
                            <div className="absolute inset-0 bg-black bg-opacity-95 z-[999] flex flex-col items-center justify-center p-8">
                                <div className="bg-[#1a2b22] p-12 pixel-border max-w-5xl w-full flex flex-col items-center relative overflow-hidden" style={{ maxHeight: '900px' }}>
                                    <button onClick={() => setShowOptionsModal(false)} className="absolute top-4 right-4 bg-red-600 px-4 py-2 pixel-border font-bold text-xl">X</button>
                                    
                                    {optionsSubView === 'main' && (
                                        <>
                                            <h2 className="text-6xl text-yellow-400 font-bold mb-12 text-shadow">MENÚ D'OPCIONS</h2>
                                            <div className="flex flex-col gap-6 w-[400px]">
                                                {gameState !== 'MENU' && <button onClick={() => setShowOptionsModal(false)} className="bg-blue-600 px-8 py-4 pixel-border font-bold text-2xl hover:bg-blue-500">TORNAR A LA PARTIDA</button>}
                                                {faction && <button onClick={() => quitToMenu()} className="bg-yellow-600 text-black px-8 py-4 pixel-border font-bold text-2xl hover:bg-yellow-500">EIXIR DE LA PARTIDA</button>}
                                                <button onClick={() => setHighContrastCards(!highContrastCards)} className="bg-purple-600 px-8 py-4 pixel-border font-bold text-2xl hover:bg-purple-500">ALT CONTRAST: {highContrastCards ? 'ON' : 'OFF'}</button>
                                                <button onClick={() => setOptionsSubView('collection')} className="bg-green-600 px-8 py-4 pixel-border font-bold text-2xl hover:bg-green-500">COL·LECCIÓ</button>
                                                <button onClick={() => setOptionsSubView('cards')} className="bg-indigo-600 px-8 py-4 pixel-border font-bold text-2xl hover:bg-indigo-500">VALOR CARTES</button>
                                                <button onClick={() => { quitToMenu(); }} className="bg-red-800 px-8 py-4 pixel-border font-bold text-2xl hover:bg-red-700 mt-8">TORNAR AL MENÚ</button>
                                            </div>
                                        </>
                                    )}

                                    {optionsSubView === 'collection' && (
                                        <div className="w-full flex flex-col items-center overflow-y-auto hide-scrollbar">
                                            <h2 className="text-5xl text-yellow-400 font-bold mb-8">COL·LECCIÓ DESCOBERTA</h2>
                                            
                                            <h3 className="text-3xl text-purple-400 font-bold mb-4 w-full border-b-2 border-purple-800 pb-2">ESDEVENIMENTS</h3>
                                            <div className="flex flex-wrap gap-4 mb-8 justify-center">
                                                {EVENTS_DB.map(e => renderCollectionItem(e, 'esdeveniment'))}
                                            </div>

                                            <h3 className="text-3xl text-blue-400 font-bold mb-4 w-full border-b-2 border-blue-800 pb-2">OBJECTES CRISTIANS</h3>
                                            <div className="flex flex-wrap gap-4 mb-8 justify-center">
                                                {OBJECTES_DB.filter(o=>o.faction==='cristia').map(o => renderCollectionItem(o, 'objecte'))}
                                            </div>

                                            <h3 className="text-3xl text-green-400 font-bold mb-4 w-full border-b-2 border-green-800 pb-2">OBJECTES MOROS</h3>
                                            <div className="flex flex-wrap gap-4 mb-8 justify-center">
                                                {OBJECTES_DB.filter(o=>o.faction==='moro').map(o => renderCollectionItem(o, 'objecte'))}
                                            </div>

                                            <h3 className="text-3xl text-orange-400 font-bold mb-4 w-full border-b-2 border-orange-800 pb-2">BEGUDES</h3>
                                            <div className="flex flex-wrap gap-4 mb-8 justify-center">
                                                {BEGUDES_DB.map(b => renderCollectionItem(b, 'beguda'))}
                                            </div>

                                            <button onClick={() => setOptionsSubView('main')} className="bg-gray-600 px-8 py-3 pixel-border font-bold text-xl mt-4">TORNAR</button>
                                        </div>
                                    )}

                                    {optionsSubView === 'cards' && (
                                        <div className="w-full flex flex-col items-center">
                                            <h2 className="text-5xl text-yellow-400 font-bold mb-8">VALOR ACTUAL DE LES CARTES</h2>
                                            <div className="flex flex-row justify-center gap-4 flex-wrap max-w-4xl">
                                                {RANKS.map(rank => {
                                                    const upgrade = rankUpgrades[rank] || 0;
                                                    const total = getFichasBase(rank) + upgrade;
                                                    return (
                                                        <div key={rank} className="flex flex-col items-center bg-black bg-opacity-50 p-4 pixel-border-sm w-[150px]">
                                                            <div className="w-[60px] h-[90px] mb-4 scale-110 pointer-events-none">
                                                                <Card card={{suit:'Ors', rank: rank}} disabled highContrast={highContrastCards} displayFichas={total} />
                                                            </div>
                                                            <span className="text-3xl font-bold text-blue-300">Nº {rank}</span>
                                                            <span className="text-xl text-green-400 mt-2">+{total} Fitxes</span>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                            <button onClick={() => setOptionsSubView('main')} className="bg-gray-600 px-8 py-3 pixel-border font-bold text-xl mt-12">TORNAR</button>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {gameState === 'MENU' && (
                            <div className="flex-1 flex flex-col items-center justify-center bg-black bg-opacity-80 z-20 p-8">
                                <div className="bg-[#0f1a14] p-16 pixel-border border-green-600 max-w-5xl w-full text-center shadow-[0_0_50px_rgba(22,163,74,0.4)]">
                                    <h1 className="text-[140px] text-yellow-400 mb-6 font-bold leading-none">REBACLATRO</h1>
                                    <p className="text-3xl text-green-400 mb-12 font-bold tracking-widest">EL ROGUELIKE DEL JOC DE COTOS</p>
                                    <div className="text-2xl text-gray-300 mb-16 text-left bg-black bg-opacity-50 p-10 pixel-border-sm leading-relaxed mx-auto w-4/5">
                                        <ul className="list-disc pl-8 space-y-4">
                                            <li><strong>Arrossegament:</strong> En últimes, s'ha d'assistir al pal o tirar triomf.</li>
                                            <li><strong>Bac:</strong> Guanyar amb el mateix número que la Mostra triplica els punts.</li>
                                            <li><strong>Bonus:</strong> Cada 50 punts aconsegueixes +1 Tirada i +1 Descart extra.</li>
                                        </ul>
                                    </div>
                                    <div className="flex gap-8 justify-center">
                                        {hasSavedGame ? (
                                            <>
                                                <button onClick={loadSavedGame} className="bg-orange-600 hover:bg-orange-500 px-12 py-8 pixel-border text-4xl font-bold animate-pulse shadow-[8px_8px_0_0_#000]">CONTINUAR</button>
                                                <button onClick={() => setGameState('SELECT_FACTION')} className="bg-blue-600 hover:bg-blue-500 px-12 py-8 pixel-border text-4xl font-bold shadow-[8px_8px_0_0_#000]">NOVA PARTIDA</button>
                                            </>
                                        ) : (
                                            <button onClick={() => setGameState('SELECT_FACTION')} className="bg-blue-600 hover:bg-blue-500 px-12 py-8 pixel-border text-4xl font-bold shadow-[8px_8px_0_0_#000]">JUGAR</button>
                                        )}
                                        <button onClick={() => { setShowOptionsModal(true); setOptionsSubView('main'); }} className="bg-gray-700 hover:bg-gray-600 px-12 py-8 pixel-border text-4xl font-bold shadow-[8px_8px_0_0_#000]">OPCIONS</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {gameState === 'SELECT_FACTION' && (
                            <div className="flex-1 flex flex-col items-center justify-center bg-black bg-opacity-80 z-20 p-8">
                                <div className="bg-[#0f1a14] p-16 pixel-border border-green-600 max-w-5xl w-full text-center shadow-[0_0_50px_rgba(22,163,74,0.4)]">
                                    <h2 className="text-6xl text-yellow-400 mb-12 font-bold">SELECCIONA EL TEU BÀNDOL</h2>
                                    <div className="flex gap-8 justify-center mt-12">
                                        <button onClick={() => startGame('cristia')} className="bg-blue-600 hover:bg-blue-500 px-12 py-6 pixel-border text-4xl font-bold shadow-[8px_8px_0_0_#000] hover:scale-105 transition-transform">BÀNDOL CRISTIÀ</button>
                                        <button onClick={() => startGame('moro')} className="bg-green-700 hover:bg-green-600 px-12 py-6 pixel-border text-4xl font-bold shadow-[8px_8px_0_0_#000] hover:scale-105 transition-transform">BÀNDOL MORO</button>
                                    </div>
                                    <button onClick={() => setGameState('MENU')} className="mt-16 text-gray-400 hover:text-white text-2xl underline">Tornar enrere</button>
                                </div>
                            </div>
                        )}

                        {gameState === 'ROUTE_MAP' && (
                            <div className="flex-1 flex flex-col items-center justify-center bg-black bg-opacity-95 z-20">
                                <h2 className="text-6xl text-yellow-400 font-bold mb-16 text-shadow">CAMP DE BATALLA (BÀNDOL {faction.toUpperCase()})</h2>
                                <div className="flex items-center gap-0 mb-16 px-12 w-full justify-center pt-24">
                                    {enemiesList.map((en, idx) => (
                                        <React.Fragment key={idx}>
                                            <div className="relative flex flex-col items-center">
                                                <div className={`absolute bottom-[110%] text-center font-bold w-[200px] text-xl transition-all duration-500 mb-4
                                                    ${round - 1 === idx ? 'text-yellow-400 scale-[1.2]' : 'text-gray-400'}`}>
                                                    {en}
                                                </div>
                                                <div className={`w-[120px] h-[120px] rounded-full border-8 flex items-center justify-center text-6xl transition-all duration-500 z-10 overflow-hidden bg-black
                                                    ${round - 1 === idx ? 'border-yellow-500 scale-[1.3] shadow-[0_0_30px_rgba(250,204,21,1)]' : 
                                                    round - 1 > idx ? 'border-green-500 opacity-60' : 'border-gray-600 opacity-50'}`}>
                                                    <img src={getEnemyImage(en)} alt={en} className="w-full h-full object-cover" />
                                                </div>
                                            </div>
                                            {idx < enemiesList.length - 1 && (
                                                <div className={`w-[100px] h-4 transition-all duration-500 ${round - 1 > idx ? 'bg-green-400 shadow-[0_0_15px_rgba(74,222,128,1)]' : 'bg-gray-700'}`} />
                                            )}
                                        </React.Fragment>
                                    ))}
                                </div>
                                <h3 className="text-5xl text-red-500 mb-12 font-bold animate-pulse mt-8">Pròxim Enfrontament: <span className="text-white">{enemiesList[round - 1]}</span></h3>
                                <button onClick={() => initRound(round)} className="bg-red-700 px-16 py-8 pixel-border text-5xl font-bold shadow-[8px_8px_0_0_#000]">COMENÇAR BATALLA ➔</button>
                            </div>
                        )}

                        {/* RENDERITZAT DEL TAULELL COMPARTIT */}

                                                                </div>

                                            </div>
                                            <div className="w-full flex justify-between items-center flex-1">
                                                <div className="w-[400px] flex items-center pl-8">
                                                    <div className="relative w-[130px] h-[180px] flex items-center justify-start">
                                                        {muestra ? <div className="absolute left-12 top-1/2 -translate-y-1/2 rotate-90 w-[100px] h-[150px] z-10"><Card card={muestra} isMuestra highContrast={highContrastCards} /></div> : <div className="absolute left-12 top-1/2 -translate-y-1/2 text-8xl opacity-80 z-10">{suitEmojis[trumpSuit]}</div>}
                                                        {deck.length > 0 && <div className="absolute left-0 top-1/2 -translate-y-1/2 w-[100px] h-[150px] cursor-pointer z-30 hover:scale-105 transition-transform" onClick={() => setShowDeckModal(true)}>{Array.from({ length: Math.min(4, Math.ceil(deck.length/8)) }).map((_, i) => <img key={i} src={REVERSO_URL} className="absolute w-full h-full object-contain drop-shadow-xl" style={{ top: `${i*-3}px`, left: `${i*-3}px` }} />)}<div className="absolute top-0 right-0 bg-red-600 text-white font-bold px-2 py-1 text-lg rounded pixel-border-sm translate-x-1/2 -translate-y-1/2">{deck.length}</div></div>}
                                                        {deck.length === 0 && muestra && <div className="absolute top-[105%] left-0 w-[100px] text-center text-red-500 font-bold bg-black bg-opacity-80 px-2 rounded pixel-border-sm animate-pulse">ÚLTIMA</div>}
                                                    </div>
                                                    <div className="ml-[80px] flex flex-col items-center bg-black bg-opacity-70 p-4 rounded pixel-border-sm z-40">
                                                        <span className="text-2xl text-yellow-300 font-bold flex items-center gap-2">TRIOMF {trumpSuit && <span className="text-4xl" title={`Pal de Triomf: ${trumpSuit}`}>{suitEmojis[trumpSuit]}</span>}</span>
                                                        {muestra && <span className="bg-black text-white text-sm px-2 py-1 rounded border border-gray-500 font-bold mt-2" title="Fitxes que atorgarà el Bac">BAC: {getCardFichas(muestra, events)}</span>}
                                                    </div>
                                                </div>
                                                <div className="flex-1 flex flex-col items-center justify-center gap-6 relative">
                                                    <div className="z-10">{ (turnLeader === 'ai' || gameState === 'RESOLVING') && gameState !== 'SELECT_TRUMP' ? <Card card={currentAiCard} isAi displayFichas={currentAiCard ? getCardFichas(currentAiCard, events)+(currentAiCard.bonusR7||0) : 0} highContrast={highContrastCards}/> : <div className="w-[100px] h-[150px] border-4 border-dashed border-gray-600 rounded-xl opacity-20" /> }</div>
                                                    <div className="text-5xl text-gray-500 opacity-40 font-bold">VS</div>
                                                    <div onDragOver={e => e.preventDefault()} onDrop={e => { e.preventDefault(); const i = parseInt(e.dataTransfer.getData('text/plain')); if (!isNaN(i)) playCard(playerHand[i]); setDraggedIndex(null); }} className={`w-[110px] h-[160px] border-8 border-dashed rounded-xl flex items-center justify-center transition-colors z-10 ${draggedIndex !== null ? 'border-green-400 bg-green-600 bg-opacity-40 animate-pulse' : 'border-blue-600 bg-blue-900 bg-opacity-30'}`}>{playedPlayerCard && <Card card={playedPlayerCard} isAi displayFichas={getCardFichas(playedPlayerCard, events)+(playedPlayerCard.bonusR7||0)} highContrast={highContrastCards}/>}</div>
                                                    {bazaResult && <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-50 pointer-events-none w-[800px] flex justify-center"><div className={`text-center inline-block bg-[#0b141a] bg-opacity-95 p-8 pixel-border shadow-2xl ${bazaResult.bac ? 'animate-bac' : 'animate-bounce'}`}><h2 className={`text-4xl font-bold mb-4 ${bazaResult.winner === 'player' || bazaResult.winner === 'canto' ? 'text-yellow-400' : 'text-red-500'}`}><FormatText text={bazaResult.message} /></h2>{bazaResult.winner === 'player' && <><div className="text-3xl text-white flex gap-4 justify-center"><span className="text-blue-300 bg-blue-900 px-3 py-1 rounded">{bazaResult.fichas} Fitxes</span><span className="text-red-400 bg-red-900 px-3 py-1 rounded">x{bazaResult.mult}</span></div><div className="text-6xl text-green-400 mt-6 font-bold">+ {bazaResult.total}</div></>}</div></div>}

                                                </div>
                                            </div>

                                <div className="w-[180px] flex flex-col items-center py-4 bg-black bg-opacity-40 border-l-4 border-black z-[60] shrink-0 overflow-visible">

                                                {activeActionId !== `o-${i}` && <div className="absolute top-1/2 right-[120%] -translate-y-1/2 w-80 bg-[#1a0f14] p-4 pixel-border opacity-0 group-hover:opacity-100 z-[100] pointer-events-none transition-opacity text-center"><p className="text-yellow-300 text-2xl mb-2"><FormatText text={o.name} /></p><p className="text-xl"><FormatText text={o.desc} /></p></div>}
                                                {activeActionId === `o-${i}` && <div className="absolute top-1/2 right-[120%] -translate-y-1/2 z-[100] flex flex-col gap-2 bg-[#1a0f14] p-3 pixel-border cursor-default" onClick={e=>e.stopPropagation()}>{gameState === 'PLAYING' && <button onClick={() => { consumeObjecte(i); setActiveActionId(null); }} className="bg-green-600 px-6 py-3 pixel-border-sm text-2xl whitespace-nowrap">USAR ARA</button>}{(gameState === 'SHOP' || gameState === 'INITIAL_SHOP') && <button onClick={() => { sellItem(o, i, 'objecte'); setActiveActionId(null); }} className="bg-red-600 px-6 py-3 pixel-border-sm text-2xl whitespace-nowrap">VENDRE (+{Math.max(1, Math.floor(getActualCost(o, 'objecte') / 2))}💰)</button>}</div>}

                                    <div className="w-[80%] h-1 bg-black opacity-50 my-6 shrink-0"></div>

                                    <span className="text-xl text-orange-300 font-bold mb-2">BEGUDES</span>
                                    <div className="flex flex-col gap-4 w-full items-center">
                                        {begudes.map((b, i) => (
                                            <div key={i} onClick={e => { e.stopPropagation(); setActiveActionId(activeActionId === `b-${i}` ? null : `b-${i}`); }} className="w-[90px] h-[160px] bg-orange-900 border-4 border-orange-400 flex items-center justify-center cursor-pointer group relative shrink-0">
                                                <img src={`${RELICS_BASE_URL}${b.img}`} alt={b.name} className="w-full h-full object-contain p-1" />
                                                {b.count > 1 && <div className="absolute -top-2 -right-2 bg-red-600 text-white text-lg font-bold px-2 py-0.5 rounded-full pixel-border-sm z-[80]">x{b.count}</div>}
                                                {activeActionId !== `b-${i}` && <div className="absolute top-1/2 right-[120%] -translate-y-1/2 w-80 bg-[#1a0f14] p-4 pixel-border opacity-0 group-hover:opacity-100 z-[100] pointer-events-none transition-opacity text-center"><p className="text-yellow-300 text-2xl mb-2"><FormatText text={b.name} /></p><p className="text-xl"><FormatText text={b.desc} /></p></div>}
                                                {activeActionId === `b-${i}` && <div className="absolute top-1/2 right-[120%] -translate-y-1/2 z-[100] flex flex-col gap-2 bg-[#1a0f14] p-3 pixel-border cursor-default" onClick={e=>e.stopPropagation()}>{gameState === 'PLAYING' && <button onClick={() => { consumeBeguda(i); setActiveActionId(null); }} className="bg-green-600 px-6 py-3 pixel-border-sm text-2xl whitespace-nowrap">BEURE ARA</button>}{(gameState === 'SHOP' || gameState === 'INITIAL_SHOP') && <button onClick={() => { sellItem(b, i, 'beguda'); setActiveActionId(null); }} className="bg-red-600 px-6 py-3 pixel-border-sm text-2xl whitespace-nowrap">VENDRE (+{Math.max(1, Math.floor(getActualCost(b, 'beguda') / 2))}💰)</button>}</div>}
                                            </div>
                                        ))}
                                        {Array.from({ length: 3 - begudes.length }).map((_, i) => <div key={`empty-drink-${i}`} className="w-[90px] h-[160px] border-4 border-dashed border-orange-800 bg-black bg-opacity-30 flex items-center justify-center opacity-20 text-3xl shrink-0">🍹</div>)}
                                    </div>
                                </div>
                            </div>
                        )}

                        {showLastTrick && modalTrick && (
                            <div className="absolute inset-0 bg-black bg-opacity-95 z-[120] flex items-center justify-center p-8" onClick={() => { setShowLastTrick(false); setModalTrick(null); }}>
                                <div className="bg-[#1a2b22] p-12 pixel-border max-w-4xl w-full flex flex-col items-center" onClick={e => e.stopPropagation()}>
                                    <h2 className="text-5xl text-yellow-400 mb-12 font-bold">DETALL DE LA BASSA</h2>
                                    <div className="flex gap-20 items-center mb-12 w-full justify-center">
                                        <div className="flex flex-col items-center"><Card card={modalTrick.aiCard} disabled isAi displayFichas={getCardFichas(modalTrick.aiCard, events)+(modalTrick.aiCard.bonusR7||0)} highContrast={highContrastCards} /><span className="text-2xl text-red-400 mt-8 font-bold bg-black px-4 py-1 rounded">RIVAL</span></div>
                                        <div className="text-6xl text-gray-500 font-bold opacity-50">VS</div>
                                        <div className="flex flex-col items-center"><Card card={modalTrick.pCard} disabled isAi displayFichas={getCardFichas(modalTrick.pCard, events)+(modalTrick.pCard.bonusR7||0)} highContrast={highContrastCards} /><span className="text-2xl text-blue-400 mt-8 font-bold bg-black px-4 py-1 rounded">TU</span></div>
                                    </div>
                                    <div className="text-3xl bg-black bg-opacity-50 p-6 pixel-border w-full text-center">Guanyador: <span className={modalTrick.winner === 'player' ? 'text-green-400 font-bold' : 'text-red-500 font-bold'}>{modalTrick.winner === 'player' ? 'TU (+'+modalTrick.totalPuntos+' punts)' : 'RIVAL'}</span></div>
                                    <button onClick={() => { setShowLastTrick(false); setModalTrick(null); }} className="mt-12 bg-red-600 px-12 py-4 pixel-border font-bold text-2xl">TANCAR</button>
                                </div>
                            </div>
                        )}

                        {showDeckModal && (
                            <div className="absolute inset-0 bg-black bg-opacity-95 z-[100] flex flex-col items-center justify-center">
                                <div className="max-w-[1500px] w-full flex flex-col items-center">
                                    <div className="flex justify-between items-center w-full mb-8 px-12"><h2 className="text-6xl text-yellow-400 font-bold">REGISTRE DE LA BARALLA</h2><button onClick={() => setShowDeckModal(false)} className="bg-red-600 px-8 py-4 pixel-border font-bold text-2xl">TANCAR</button></div>
                                    <div className="flex flex-col gap-4 w-full items-center bg-[#1a2b22] p-8 pixel-border rounded-xl">
                                        {SUITS.map(suit => (
                                            <div key={suit} className="flex flex-row -space-x-8 justify-center w-full relative">
                                                {RANKS.map(rank => {
                                                    const upgrade = rankUpgrades[rank] || 0;
                                                    const dummyCard = { suit, rank, fichasBase: getFichasBase(rank) + upgrade };
                                                    const seen = deck.some(c => c.suit === suit && c.rank === rank) || aiHand.some(c => c.suit === suit && c.rank === rank) || (muestra && muestra.suit === suit && muestra.rank === rank);
                                                    return <div key={rank} className={`transition-opacity transform scale-90 ${seen ? 'opacity-100 hover:scale-105 z-10 hover:z-50 text-white' : 'opacity-30 grayscale text-gray-500'}`}><Card card={dummyCard} disabled isAi displayFichas={getCardFichas(dummyCard, events)} highContrast={highContrastCards} /></div>;
                                                })}
                                            </div>
                                        ))}
                                    </div>
                                    <p className="text-gray-500 text-2xl mt-4 font-bold bg-black px-6 py-2 rounded pixel-border-sm">*Les cartes en gris encara no s'han vist en esta ronda</p>
                                </div>
                            </div>
                        )}

                        {gameState === 'ROUND_SUMMARY' && roundSummary && (
                            <div className="flex-1 flex flex-col items-center justify-center bg-black bg-opacity-95 z-20">
                                <h1 className="text-[120px] text-yellow-400 mb-8 font-bold animate-pulse">¡COTO SUPERAT!</h1>
                                <div className="bg-[#1a2b22] p-12 pixel-border max-w-3xl w-full flex flex-col items-center mb-12">
                                    <p className="text-4xl text-gray-300 mb-6">Puntuació: <span className="text-blue-400 font-bold">{roundSummary.score}</span> / <span className="text-red-500">{roundSummary.target}</span></p>
                                    <p className="text-4xl text-gray-300 mb-6">Tirades restants: <span className="text-green-400 font-bold">{roundSummary.tiradasLeft}</span></p>
                                    <p className="text-5xl text-yellow-400 mt-6 font-bold bg-black px-8 py-4 pixel-border-sm">Recompensa: +{roundSummary.monedasEarned} 💰</p>
                                </div>
                                <button onClick={nextRoundAndShop} className="bg-blue-600 px-16 py-8 pixel-border text-5xl font-bold shadow-[8px_8px_0_0_#000]">ANAR AL MERCADER ➔</button>
                            </div>
                        )}

                        {gameState === 'DERROTA' && (
                            <div className="flex-1 flex flex-col items-center justify-center bg-black bg-opacity-95 z-20">
                                <h1 className="text-[150px] text-red-600 mb-8 font-bold">AL POU</h1>
                                <p className="text-4xl text-gray-300 mb-12">T'has quedat sense tirades al Coto {round}.</p>
                                
                                {renderRunSummary()}

                                <div className="flex gap-8">
                                    <button onClick={() => startGame(faction)} className="bg-yellow-600 text-black px-12 py-6 pixel-border text-4xl font-bold shadow-[8px_8px_0_0_#000]">REINTENTAR</button>
                                    <button onClick={quitToMenu} className="bg-gray-700 text-white px-12 py-6 pixel-border text-4xl font-bold shadow-[8px_8px_0_0_#000]">TORNAR AL MENÚ</button>
                                </div>
                            </div>
                        )}
                        
                        {gameState === 'VICTÒRIA' && (
                            <div className="flex-1 flex flex-col items-center justify-center bg-black bg-opacity-95 z-20">
                                <h1 className="text-[120px] text-yellow-400 mb-8 font-bold animate-bac text-center">¡ETS EL REI<br/>DEL BAC!</h1>
                                <p className="text-4xl text-gray-300 mb-12">Has arruïnat al poble guanyant tots els cotos.</p>
                                
                                {renderRunSummary()}

                                <button onClick={quitToMenu} className="bg-green-600 px-16 py-8 pixel-border text-4xl font-bold shadow-[8px_8px_0_0_#000]">TORNAR AL MENÚ PRINCIPAL</button>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>
